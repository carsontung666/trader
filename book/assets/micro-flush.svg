<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="强趋势停顿一根之后直接向下 flush，微回撤失效；成功图不能单独进样本">
  <title>微回撤反例：停顿后直接 flush</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .pause { fill: none; stroke: #C08A12; stroke-width: 1.4; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .pause { stroke: #DDA33A; } .stop { stroke: #EF6B5E; }
    }
  </style>
  <text class="t-a" x="36" y="26">成功图最容易诱发 FOMO。这一张必须另收。</text>
  <line class="up wk" x1="60" y1="210" x2="60" y2="250"/><rect class="up" x="54" y="220" width="12" height="20"/>
  <line class="up wk" x1="110" y1="165" x2="110" y2="225"/><rect class="up" x="104" y="176" width="12" height="36"/>
  <line class="up wk" x1="160" y1="110" x2="160" y2="185"/><rect class="up" x="154" y="122" width="12" height="48"/>
  <line class="up wk" x1="210" y1="62" x2="210" y2="135"/><rect class="up" x="204" y="74" width="12" height="48"/>
  <rect class="pause" x="238" y="52" width="48" height="72" rx="4"/>
  <line class="dn wk" x1="262" y1="64" x2="262" y2="118"/><rect class="dn" x="256" y="78" width="12" height="24"/>
  <text class="t-a" x="232" y="44">停 1 根</text>
  <line class="up wk" x1="330" y1="48" x2="330" y2="108"/><rect class="up" x="324" y="58" width="12" height="36"/>
  <text class="t-g" x="300" y="40">穿过前高 = 触发</text>
  <line class="dn wk" x1="400" y1="70" x2="400" y2="175"/><rect class="dn" x="394" y="95" width="12" height="60"/>
  <line class="dn wk" x1="460" y1="140" x2="460" y2="240"/><rect class="dn" x="454" y="165" width="12" height="55"/>
  <line class="dn wk" x1="520" y1="190" x2="520" y2="268"/><rect class="dn" x="514" y="210" width="12" height="42"/>
  <line class="stop" x1="238" y1="124" x2="620" y2="124"/>
  <text class="t-r" x="628" y="128">失效：停顿低</text>
  <text class="t-r" x="380" y="64">触发后立刻 flush</text>
  <text class="t" x="36" y="280">若这根 flush 同时打穿 LULD，图上的几美分止损在停牌里无法成交。无法接受跳空则仓位是 0。</text>
</svg>
