<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="VWAP是量权平均成本路径；从下靠近可能遇卖压，站上后回踩可能变支撑">
  <title>VWAP 是位置，角色随接近方向变</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #3D6A94; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .vw { fill: none; stroke: #3D6A94; stroke-width: 2.2; }
    .vol { fill: #C5CCD3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #7FA9CE; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .vw { stroke: #7FA9CE; }
      .vol { fill: #3A424C; }
    }
  </style>
  <polyline class="vw" points="50,210 120,200 190,195 260,188 330,170 400,150 470,145 540,138 620,130"/>
  <text class="t-b" x="50" y="28">VWAP：今天成交的量权平均成本，随成交移动</text>

  <line class="dn wk" x1="70" y1="220" x2="70" y2="270"/><rect class="dn" x="64" y="230" width="12" height="30"/>
  <line class="up wk" x1="120" y1="190" x2="120" y2="250"/><rect class="up" x="114" y="200" width="12" height="40"/>
  <line class="dn wk" x1="170" y1="200" x2="170" y2="255"/><rect class="dn" x="164" y="210" width="12" height="35"/>
  <line class="up wk" x1="220" y1="160" x2="220" y2="220"/><rect class="up" x="214" y="170" width="12" height="40"/>
  <line class="up wk" x1="270" y1="130" x2="270" y2="195"/><rect class="up" x="264" y="140" width="12" height="45"/>
  <line class="dn wk" x1="320" y1="145" x2="320" y2="185"/><rect class="dn" x="314" y="155" width="12" height="22"/>
  <line class="up wk" x1="370" y1="110" x2="370" y2="165"/><rect class="up" x="364" y="120" width="12" height="35"/>
  <line class="up wk" x1="420" y1="90" x2="420" y2="150"/><rect class="up" x="414" y="100" width="12" height="40"/>
  <line class="dn wk" x1="470" y1="120" x2="470" y2="170"/><rect class="dn" x="464" y="135" width="12" height="25"/>
  <line class="up wk" x1="520" y1="80" x2="520" y2="145"/><rect class="up" x="514" y="90" width="12" height="40"/>
  <line class="up wk" x1="570" y1="60" x2="570" y2="120"/><rect class="up" x="564" y="70" width="12" height="40"/>

  <rect class="vol" x="64" y="290" width="12" height="20"/>
  <rect class="vol" x="114" y="280" width="12" height="30"/>
  <rect class="vol" x="164" y="286" width="12" height="24"/>
  <rect class="vol" x="214" y="270" width="12" height="40"/>
  <rect class="vol" x="264" y="262" width="12" height="48"/>
  <rect class="vol" x="314" y="292" width="12" height="18"/>
  <rect class="vol" x="364" y="275" width="12" height="35"/>
  <rect class="vol" x="414" y="268" width="12" height="42"/>
  <rect class="vol" x="464" y="288" width="12" height="22"/>
  <rect class="vol" x="514" y="272" width="12" height="38"/>
  <rect class="vol" x="564" y="265" width="12" height="45"/>

  <text class="t-r" x="80" y="188">从下靠近：可能遇卖压</text>
  <text class="t-g" x="380" y="200">站上后回踩：支撑候选</text>
  <text class="t" x="50" y="330">止损放结构失效处，不要钉在 VWAP 线上。开盘前几分钟样本太少，线会乱跳。</text>
</svg>
