<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="看涨 Risk Reversal：卖 OTM Put 换买 OTM Call，下跌承担接货，上涨才开始赚">
  <title>Risk Reversal 不是免费 Call</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .ax { stroke: #C5CCD3; stroke-width: 1.2; }
    .pay { stroke: #3D6A94; stroke-width: 2.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .ax { stroke: #3A424C; } .pay { stroke: #7FA9CE; }
    }
  </style>
  <text class="t-b" x="40" y="30">到期：Long OTM Call + Short OTM Put（净权利金可接近 0）</text>
  <line class="ax" x1="50" y1="160" x2="720" y2="160"/>
  <polyline class="pay" points="50,250 250,160 500,160 720,70"/>
  <text class="t-r" x="50" y="236">跌到 0 ≈ 亏 100×K_P</text>
  <text class="t" x="232" y="280">K_P</text>
  <text class="t" x="484" y="280">K_C</text>
  <text class="t-g" x="560" y="64">涨过 Call 才净赚</text>
  <text class="t" x="300" y="148">中间接近 0</text>
  <text class="t t-r" x="40" y="292">「零成本」= 用接 100 股的义务换一张 Call。不是 Theta 被永久抵消，也不是免费彩票。</text>
</svg>
