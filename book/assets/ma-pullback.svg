<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="均线回踩：碰线不是触发；均线要和更高高点更高低点同向，收回或微结构突破才进">
  <title>均线回踩：碰线不是触发</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #3D6A94; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .ma { fill: none; stroke: #3D6A94; stroke-width: 2; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #7FA9CE; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .ma { stroke: #7FA9CE; } .stop { stroke: #EF6B5E; }
    }
  </style>
  <polyline class="ma" points="50,230 150,200 260,175 380,155 500,140 660,125"/>
  <text class="t-b" x="40" y="28">短均线向上 + 更高高点 / 更高低点，才叫趋势语境。</text>
  <line class="up wk" x1="80" y1="180" x2="80" y2="240"/><rect class="up" x="74" y="195" width="12" height="30"/>
  <line class="up wk" x1="140" y1="140" x2="140" y2="210"/><rect class="up" x="134" y="155" width="12" height="40"/>
  <line class="dn wk" x1="210" y1="160" x2="210" y2="210"/><rect class="dn" x="204" y="175" width="12" height="25"/>
  <line class="up wk" x1="280" y1="110" x2="280" y2="185"/><rect class="up" x="274" y="125" width="12" height="45"/>
  <line class="dn wk" x1="360" y1="130" x2="360" y2="175"/><rect class="dn" x="354" y="145" width="12" height="20"/>
  <line class="up wk" x1="440" y1="80" x2="440" y2="160"/><rect class="up" x="434" y="95" width="12" height="50"/>
  <line class="up wk" x1="520" y1="60" x2="520" y2="130"/><rect class="up" x="514" y="75" width="12" height="40"/>
  <line class="stop" x1="190" y1="215" x2="600" y2="215"/>
  <text class="t-r" x="608" y="219">失效：摆动低点</text>
  <text class="t-g" x="40" y="268">触发：收回均线，或突破回踩里的微结构高点</text>
  <text class="t" x="40" y="290">周期是启发式。必须另收跌穿均线的失败样本，两张成功图有选择偏差。</text>
</svg>
