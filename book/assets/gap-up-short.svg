<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="高开到预先阻力后，开盘区间失守才空，不要开盘盲空">
  <title>Gap-up short：阻力预先存在，开盘区间清楚，拒绝之后才空</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .res { fill: #FDE8E8; }
    .gap { fill: #F4F1E8; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .or { stroke: #3D6A94; stroke-width: 1.3; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-a { fill: #E0A93A; } .t-r { fill: #EF6B5E; }
      .res { fill: #3A2424; } .gap { fill: #2A2820; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .or { stroke: #7FA9CE; }
    }
  </style>
  <rect class="res" x="40" y="40" width="680" height="40"/>
  <text class="t-a" x="56" y="28">预先标好的阻力：前高 / 整美元 / 日线供给区</text>
  <rect class="gap" x="40" y="170" width="90" height="70"/>
  <text class="t" x="52" y="210">缺口</text>
  <line class="up wk" x1="80" y1="200" x2="80" y2="250"/><rect class="up" x="74" y="215" width="12" height="25"/>
  <text class="t" x="48" y="270">昨收</text>

  <line class="up wk" x1="180" y1="48" x2="180" y2="140"/><rect class="up" x="174" y="70" width="12" height="50"/>
  <text class="t-a" x="200" y="68">高开到阻力</text>
  <line class="dn wk" x1="230" y1="50" x2="230" y2="130"/><rect class="dn" x="224" y="65" width="12" height="45"/>
  <line class="up wk" x1="280" y1="55" x2="280" y2="125"/><rect class="up" x="274" y="70" width="12" height="40"/>
  <line class="or" x1="160" y1="50" x2="360" y2="50"/>
  <line class="or" x1="160" y1="125" x2="360" y2="125"/>
  <text class="t" x="368" y="90">开盘区间</text>
  <line class="dn wk" x1="400" y1="70" x2="400" y2="180"/><rect class="dn" x="394" y="95" width="12" height="65"/>
  <text class="t-r" x="420" y="150">触发：区间下沿失守</text>
  <line class="dn wk" x1="500" y1="150" x2="500" y2="230"/><rect class="dn" x="494" y="165" width="12" height="50"/>
  <line class="dn wk" x1="560" y1="180" x2="560" y2="260"/><rect class="dn" x="554" y="195" width="12" height="50"/>
  <line class="up wk" x1="620" y1="200" x2="620" y2="250"/><rect class="up" x="614" y="210" width="12" height="30"/>
  <text class="t" x="580" y="280">反弹失败再 cover 分批</text>
  <text class="t" x="40" y="294">高开本身说明买盘曾经很强。没有近的失效位（例如开盘区间上沿）就不要空。</text>
</svg>
