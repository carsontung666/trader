<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="扫描器报警后逐层过滤：核对、催化、日线、结构、盘口，写不齐就跳过">
  <title>扫描器缩小搜索，不制造必须交易</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .n { fill: #EEF3F8; stroke: #3D6A94; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .n { fill: #1C2833; stroke: #7FA9CE; }
    }
  </style>
  <rect class="n" x="20" y="20" width="100" height="52" rx="6"/><text class="t-b" x="44" y="50">报警</text>
  <text class="t-b" x="128" y="50">→</text>
  <rect class="n" x="148" y="20" width="120" height="52" rx="6"/><text class="t-b" x="164" y="42">代码 / 价格</text><text class="t" x="170" y="58">量能核对</text>
  <text class="t-b" x="276" y="50">→</text>
  <rect class="n" x="296" y="20" width="120" height="52" rx="6"/><text class="t-b" x="314" y="42">催化与文件</text><text class="t" x="322" y="58">不是标题</text>
  <text class="t-b" x="424" y="50">→</text>
  <rect class="n" x="444" y="20" width="120" height="52" rx="6"/><text class="t-b" x="462" y="42">日线位置</text><text class="t" x="466" y="58">上方空间</text>
  <text class="t-b" x="572" y="50">→</text>
  <rect class="n" x="592" y="20" width="148" height="52" rx="6"/><text class="t-b" x="612" y="42">1m / 5m 结构</text><text class="t" x="620" y="58">同一周期</text>

  <rect class="n" x="148" y="100" width="160" height="52" rx="6"/><text class="t-b" x="164" y="122">点差 / 深度</text><text class="t" x="176" y="140">LULD 距离</text>
  <text class="t-b" x="316" y="130">→</text>
  <rect class="n" x="336" y="100" width="180" height="52" rx="6"/><text class="t-b" x="352" y="122">触发与风险写完</text><text class="t" x="368" y="140">才允许下单</text>
  <text class="t-b" x="524" y="130">→</text>
  <rect class="n" x="544" y="100" width="196" height="52" rx="6"/><text class="t-b" x="580" y="122">一层答不出</text><text class="t" x="592" y="140">整只跳过</text>

  <text class="t" x="20" y="190">同一只股票反复报警，通常是同一趋势的连续更新，不是多份独立证据。</text>
  <text class="t" x="20" y="214">不同扫描器同时报同一事件，也不要乘成「三重确认」。</text>
  <text class="t" x="20" y="238">保存报警时间戳。复盘时才能判断你是在可执行点进，还是已经变成最后一棒。</text>
  <text class="t" x="20" y="262">参数要可复现：价格区间、缺口、相对量、流通盘、时段、过滤品种、软件版本。</text>
  <text class="t" x="20" y="286">速度只在规则已经写清时有价值。规则不清，更快只是更快交佣金。</text>
  <text class="t" x="20" y="310">扫描器底不是买入。漏斗底仍要形状、位置、触发、失效。</text>
</svg>
