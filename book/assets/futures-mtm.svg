<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="期货保证金是履约抵押；盯市每天改权益，低于维持保证金就会被要求补钱或强平">
  <title>盯市：亏损立刻改账户</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .box { fill: #EEF3F8; stroke: #3D6A94; }
    .bad { fill: #FDE8E8; stroke: #C0392B; }
    .ax { stroke: #C5CCD3; stroke-width: 1.2; }
    .eq { stroke: #3D6A94; stroke-width: 2.2; fill: none; }
    .line { stroke: #C0392B; stroke-width: 1.4; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-r { fill: #EF6B5E; }
      .box { fill: #1C2833; stroke: #7FA9CE; }
      .bad { fill: #3A2424; stroke: #EF6B5E; }
      .ax { stroke: #3A424C; } .eq { stroke: #7FA9CE; } .line { stroke: #EF6B5E; }
    }
  </style>
  <line class="ax" x1="40" y1="190" x2="430" y2="190"/>
  <line class="ax" x1="40" y1="30" x2="40" y2="190"/>
  <polyline class="eq" points="50,70 120,90 190,60 260,130 330,150 410,175"/>
  <line class="line" x1="40" y1="145" x2="430" y2="145"/>
  <text class="t" x="50" y="24">账户权益</text>
  <text class="t-r" x="300" y="138">维持保证金</text>
  <text class="t" x="50" y="214">盯市：结算价改权益。跌破线不是「再等等」，是补钱、减仓或被强平。</text>

  <rect class="box" x="460" y="20" width="280" height="90" rx="8"/>
  <text class="t-b" x="478" y="48">保证金不是成本价</text>
  <text class="t" x="478" y="74">没买下指数或原油</text>
  <text class="t" x="478" y="96">只是履约抵押</text>

  <rect class="bad" x="460" y="122" width="280" height="90" rx="8"/>
  <text class="t-b" x="478" y="150">日保证金更低 ≠ 更安全</text>
  <text class="t" x="478" y="176">同样一跳，盈亏美元不变</text>
  <text class="t" x="478" y="198">只是允许更高杠杆</text>
</svg>
