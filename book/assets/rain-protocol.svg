<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="RAIN：识别、容纳、调查、不认同；盘中压成三十秒：命名、离键、三次呼吸、读红旗卡">
  <title>RAIN 接到订单权限上</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .n { fill: #EEF3F8; stroke: #3D6A94; }
    .warn { fill: #FFF7E0; stroke: #B07D0A; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .n { fill: #1C2833; stroke: #7FA9CE; }
      .warn { fill: #3A3420; stroke: #E0A93A; }
    }
  </style>
  <rect class="n" x="16" y="20" width="170" height="100" rx="8"/>
  <text class="t-b" x="32" y="48">R Recognize</text>
  <text class="t" x="32" y="74">我正在 FOMO / 怒</text>
  <text class="t" x="32" y="96">给它一个词</text>

  <rect class="n" x="202" y="20" width="170" height="100" rx="8"/>
  <text class="t-b" x="218" y="48">A Allow</text>
  <text class="t" x="218" y="74">承认反应在</text>
  <text class="t" x="218" y="96">不马上消灭它</text>

  <rect class="n" x="388" y="20" width="170" height="100" rx="8"/>
  <text class="t-b" x="404" y="48">I Investigate</text>
  <text class="t" x="404" y="74">哪里紧？什么事实？</text>
  <text class="t" x="404" y="96">想改哪张订单？</text>

  <rect class="n" x="574" y="20" width="170" height="100" rx="8"/>
  <text class="t-b" x="590" y="48">N 不认同</text>
  <text class="t" x="590" y="74">情绪不是命令</text>
  <text class="t" x="590" y="96">选预定动作</text>

  <rect class="warn" x="16" y="136" width="728" height="84" rx="8"/>
  <text class="t-b" x="32" y="164">盘中 30 秒版</text>
  <text class="t" x="32" y="188">命名 → 双手离键 → 三次慢呼吸 → 读红旗卡 → 清单过了才继续</text>
  <text class="t" x="32" y="208">已触及日亏损或无法执行：先 flatten / 停机，再做练习。有未管理仓位时不要闭眼冥想。</text>
</svg>
