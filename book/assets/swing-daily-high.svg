<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="日线回撤后第一根创新高：趋势、回撤低点、触发线、失效位必须事先画好">
  <title>Swing：第一根日线创新高</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .trig { stroke: #15803D; stroke-width: 1.6; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tgt { stroke: #3D6A94; stroke-width: 1.4; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .trig { stroke: #35C07B; } .stop { stroke: #EF6B5E; } .tgt { stroke: #7FA9CE; }
    }
  </style>
  <text class="t-g" x="30" y="26">上升结构里的回撤，再等第一根日线越过前日高</text>
  <line class="up wk" x1="50" y1="150" x2="50" y2="210"/><rect class="up" x="44" y="160" width="12" height="40"/>
  <line class="up wk" x1="90" y1="110" x2="90" y2="170"/><rect class="up" x="84" y="120" width="12" height="40"/>
  <line class="up wk" x1="130" y1="70" x2="130" y2="140"/><rect class="up" x="124" y="80" width="12" height="50"/>
  <line class="dn wk" x1="170" y1="90" x2="170" y2="165"/><rect class="dn" x="164" y="110" width="12" height="40"/>
  <line class="dn wk" x1="210" y1="120" x2="210" y2="190"/><rect class="dn" x="204" y="140" width="12" height="35"/>
  <line class="up wk" x1="250" y1="115" x2="250" y2="175"/><rect class="up" x="244" y="125" width="12" height="38"/>
  <line class="up wk" x1="300" y1="70" x2="300" y2="140"/><rect class="up" x="294" y="80" width="12" height="48"/>
  <line class="trig" x1="230" y1="115" x2="430" y2="115"/>
  <line class="stop" x1="40" y1="190" x2="430" y2="190"/>
  <line class="tgt" x1="40" y1="70" x2="430" y2="70"/>
  <text class="t" x="310" y="108">触发：破前日高</text>
  <text class="t-r" x="310" y="184">失效：回撤低点</text>
  <text class="t" x="310" y="64">第一目标：前高 / 计量 R</text>
  <text class="t" x="30" y="236">「穿过」和「收在上方」是两套样本，必须分开统计。触发日若碰上财报，技术止损管不住盘后跳空。</text>
  <text class="t" x="30" y="260">小时图可以优化执行，不能把日线失效位偷偷收紧。仓位按 max(技术风险, 跳空压力) 算。</text>
</svg>
