<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="开盘靠近盘前高且失效近，才是触发；开盘已远离所有盘前线，是追">
  <title>开盘已延伸 = 追，不叫 Gap and Go</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .pm { fill: #F4F1E8; }
    .hod { stroke: #C08A12; stroke-width: 1.7; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ent { stroke: #15803D; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; } .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .pm { fill: #2A2820; } .hod { stroke: #DDA33A; } .stop { stroke: #EF6B5E; } .ent { stroke: #35C07B; }
    }
  </style>
  <rect class="pm" x="20" y="48" width="160" height="200"/>
  <text class="t-g" x="20" y="28">左：开盘穿过盘前高，失效仍近</text>
  <line class="up wk" x1="50" y1="170" x2="50" y2="220"/><rect class="up" x="44" y="180" width="12" height="28"/>
  <line class="up wk" x1="90" y1="130" x2="90" y2="190"/><rect class="up" x="84" y="145" width="12" height="32"/>
  <line class="dn wk" x1="130" y1="140" x2="130" y2="200"/><rect class="dn" x="124" y="155" width="12" height="30"/>
  <line class="hod" x1="20" y1="130" x2="360" y2="130"/>
  <text class="t-a" x="200" y="122">盘前高 8.60</text>
  <line class="up wk" x1="210" y1="90" x2="210" y2="165"/><rect class="up" x="204" y="105" width="12" height="45"/>
  <line class="ent" x1="200" y1="105" x2="280" y2="105"/>
  <line class="stop" x1="20" y1="220" x2="280" y2="220"/>
  <text class="t" x="20" y="268">入 8.66，失效 8.38：还能按公式算股数</text>

  <rect class="pm" x="400" y="48" width="160" height="200"/>
  <text class="t-r" x="400" y="28">右：开盘已远离全部盘前线</text>
  <line class="up wk" x1="430" y1="200" x2="430" y2="235"/><rect class="up" x="424" y="208" width="12" height="20"/>
  <line class="up wk" x1="470" y1="170" x2="470" y2="220"/><rect class="up" x="464" y="182" width="12" height="26"/>
  <line class="hod" x1="400" y1="170" x2="740" y2="170"/>
  <text class="t-a" x="580" y="162">盘前高 8.60</text>
  <line class="up wk" x1="600" y1="40" x2="600" y2="90"/><rect class="up" x="594" y="48" width="12" height="30"/>
  <line class="ent" x1="590" y1="48" x2="720" y2="48"/>
  <line class="stop" x1="400" y1="235" x2="720" y2="235"/>
  <text class="t-r" x="400" y="268">入 9.40，失效还在 8.38：这是追</text>
  <text class="t" x="20" y="304">名字还叫 Gap and Go 也救不了盈亏比。等下一根可画的近端失效，或仓位写 0。</text>
</svg>
