<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="期货保证金是履约抵押不是买下标的；到期要平仓或移仓">
  <title>期货：保证金不是成本价</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #EEF3F8; stroke: #3D6A94; }
    .warn { fill: #FFF7E0; stroke: #B07D0A; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .box { fill: #1C2833; stroke: #7FA9CE; }
      .warn { fill: #3A3420; stroke: #E0A93A; }
    }
  </style>
  <rect class="box" x="20" y="24" width="230" height="140" rx="8"/>
  <text class="t-b" x="48" y="56">合约</text>
  <text class="t" x="40" y="84">根符号 + 到期月</text>
  <text class="t" x="40" y="108">乘数、最小跳动</text>
  <text class="t" x="40" y="132">现金或实物结算</text>

  <rect class="box" x="265" y="24" width="230" height="140" rx="8"/>
  <text class="t-b" x="285" y="56">保证金</text>
  <text class="t" x="285" y="84">履约抵押 + 盯市</text>
  <text class="t" x="285" y="108">不是买下了指数</text>
  <text class="t" x="285" y="132">不够会被直接强平</text>

  <rect class="warn" x="510" y="24" width="230" height="140" rx="8"/>
  <text class="t-b" x="530" y="56">到期前三选一</text>
  <text class="t" x="530" y="84">平仓 offset</text>
  <text class="t" x="530" y="108">移仓 roll（关旧开新）</text>
  <text class="t" x="530" y="132">持有进入结算</text>

  <text class="t" x="20" y="192">盈亏 = (价格变动 ÷ 最小跳) × 每跳价值 × 张数。不同合约「1 点」的钱数不同。</text>
  <text class="t" x="20" y="214">Micro 只是把名义缩小，波动百分比可以一样大。日保证金更低 = 杠杆更高，不是更安全。</text>
</svg>
