<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="价格突破阻力后无法维持，快速跌回原区间，追价多头止损加大卖压">
  <title>Bull trap：突破没被接受，不是「主力诱多」叙事</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .lvl { stroke: #C08A12; stroke-width: 1.8; }
    .box { fill: none; stroke: #8A94A0; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-r { fill: #EF6B5E; } .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .lvl { stroke: #DDA33A; } .box { stroke: #6E7884; }
    }
  </style>
  <text class="t-b" x="36" y="28">突破明显阻力 → 追价进入 → 无法维持 → 跌回原区间</text>
  <rect class="box" x="50" y="140" width="300" height="90"/>
  <line class="lvl" x1="50" y1="140" x2="700" y2="140"/>
  <text class="t-a" x="610" y="132">原区间上沿</text>

  <line class="up wk" x1="80" y1="160" x2="80" y2="220"/><rect class="up" x="74" y="170" width="12" height="35"/>
  <line class="dn wk" x1="130" y1="155" x2="130" y2="225"/><rect class="dn" x="124" y="165" width="12" height="45"/>
  <line class="up wk" x1="180" y1="150" x2="180" y2="215"/><rect class="up" x="174" y="160" width="12" height="40"/>
  <line class="dn wk" x1="230" y1="148" x2="230" y2="210"/><rect class="dn" x="224" y="158" width="12" height="38"/>
  <line class="up wk" x1="300" y1="70" x2="300" y2="175"/><rect class="up" x="294" y="85" width="12" height="70"/>
  <text class="t-a" x="318" y="90">看起来破了</text>
  <line class="dn wk" x1="380" y1="80" x2="380" y2="230"/><rect class="dn" x="368" y="120" width="24" height="90"/>
  <text class="t-r" x="410" y="170">快速还回去</text>
  <line class="dn wk" x1="460" y1="180" x2="460" y2="260"/><rect class="dn" x="454" y="200" width="12" height="45"/>
  <line class="up wk" x1="520" y1="190" x2="520" y2="255"/><rect class="up" x="514" y="205" width="12" height="30"/>

  <text class="t" x="36" y="270">要看的是：突破有没有被接受、放量后有没有 progress、回落是否重新跌破触发位。</text>
  <text class="t" x="36" y="290">失败之后，反方向若出现可定义风险的结构，才是新 setup。不要猜「主力故意诱多」。</text>
</svg>
