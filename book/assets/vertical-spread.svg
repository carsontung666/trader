<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="牛市看涨借记价差：最大亏净借记，最大赚两行权价之差减去借记">
  <title>垂直价差把两边都封住</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .ax { stroke: #C5CCD3; stroke-width: 1.2; }
    .pay { stroke: #15803D; stroke-width: 2.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .ax { stroke: #3A424C; } .pay { stroke: #35C07B; }
    }
  </style>
  <text class="t-b" x="40" y="32">Bull Call Debit：买低行权价 Call，卖更高行权价 Call</text>
  <line class="ax" x1="60" y1="160" x2="720" y2="160"/>
  <line class="ax" x1="180" y1="50" x2="180" y2="240"/>
  <polyline class="pay" points="60,200 180,200 420,80 720,80"/>
  <text class="t-r" x="70" y="220">最大亏 ≈ 净借记</text>
  <text class="t" x="168" y="258">低 K</text>
  <text class="t" x="400" y="258">高 K</text>
  <text class="t-g" x="440" y="70">最大赚 ≈ 宽度 − 借记</text>
  <text class="t" x="40" y="272">有限风险 ≠ 小风险。一腿被提前指派或停牌，图上的最大亏损会暂时失真。</text>
</svg>
