<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="旗形有 3 到 5 根旗面；微回撤只停 1 到 2 根，失效更近、噪声更大">
  <title>微回撤不是更快的旗形</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .box { fill: #F4F1E8; }
    .trg { stroke: #15803D; stroke-width: 1.6; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .box { fill: #2A2820; } .trg { stroke: #35C07B; } .stop { stroke: #EF6B5E; }
    }
  </style>
  <rect class="box" x="24" y="46" width="330" height="196"/>
  <text class="t-g" x="24" y="28">左：旗形 · 3–5 根旗面</text>
  <line class="up wk" x1="54" y1="180" x2="54" y2="228"/><rect class="up" x="48" y="192" width="12" height="26"/>
  <line class="up wk" x1="96" y1="120" x2="96" y2="200"/><rect class="up" x="90" y="135" width="12" height="52"/>
  <line class="dn wk" x1="140" y1="145" x2="140" y2="198"/><rect class="dn" x="134" y="158" width="12" height="28"/>
  <line class="dn wk" x1="182" y1="152" x2="182" y2="192"/><rect class="dn" x="176" y="162" width="12" height="22"/>
  <line class="up wk" x1="224" y1="148" x2="224" y2="188"/><rect class="up" x="218" y="158" width="12" height="20"/>
  <line class="dn wk" x1="266" y1="150" x2="266" y2="186"/><rect class="dn" x="260" y="160" width="12" height="18"/>
  <line class="up wk" x1="314" y1="88" x2="314" y2="168"/><rect class="up" x="308" y="102" width="12" height="50"/>
  <line class="trg" x1="24" y1="145" x2="354" y2="145"/>
  <line class="stop" x1="24" y1="198" x2="280" y2="198"/>
  <text class="t" x="24" y="266">失效在旗面低。噪声较少，股数可按公式算。</text>

  <rect class="box" x="400" y="46" width="336" height="196"/>
  <text class="t-a" x="400" y="28">右：微回撤 · 停 1–2 根</text>
  <line class="up wk" x1="430" y1="190" x2="430" y2="228"/><rect class="up" x="424" y="200" width="12" height="20"/>
  <line class="up wk" x1="472" y1="140" x2="472" y2="205"/><rect class="up" x="466" y="152" width="12" height="40"/>
  <line class="up wk" x1="514" y1="88" x2="514" y2="160"/><rect class="up" x="508" y="100" width="12" height="48"/>
  <line class="dn wk" x1="564" y1="78" x2="564" y2="128"/><rect class="dn" x="558" y="92" width="12" height="22"/>
  <line class="up wk" x1="620" y1="42" x2="620" y2="118"/><rect class="up" x="614" y="52" width="12" height="52"/>
  <line class="trg" x1="508" y1="88" x2="736" y2="88"/>
  <line class="stop" x1="548" y1="128" x2="700" y2="128"/>
  <text class="t-r" x="400" y="266">失效更近，影线更容易扫。这是用噪声换紧止损。</text>
  <text class="t" x="24" y="300">两笔不要并成一个「回撤」胜率。旗面还没走完，不能提前改口成微回撤。</text>
</svg>
