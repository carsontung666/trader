<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="强趋势是推进、回踩、旧阻力成为新支撑候选；新低跌破前一有效支撑则阶梯坏了">
  <title>价格阶梯：旧阻力成为新支撑是候选，要回踩验证</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .l1 { stroke: #8A94A0; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .l2 { stroke: #3D6A94; stroke-width: 1.5; }
    .l3 { stroke: #C08A12; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .l1 { stroke: #6E7884; } .l2 { stroke: #7FA9CE; } .l3 { stroke: #DDA33A; }
    }
  </style>
  <text class="t-b" x="36" y="28">强趋势不是直线，是推进 → 回踩 → 重新找到支撑</text>

  <line class="l1" x1="40" y1="240" x2="280" y2="240"/>
  <line class="l2" x1="160" y1="170" x2="480" y2="170"/>
  <line class="l3" x1="360" y1="100" x2="720" y2="100"/>

  <line class="up wk" x1="70" y1="210" x2="70" y2="270"/><rect class="up" x="64" y="220" width="12" height="35"/>
  <line class="up wk" x1="110" y1="175" x2="110" y2="245"/><rect class="up" x="104" y="185" width="12" height="45"/>
  <line class="dn wk" x1="160" y1="175" x2="160" y2="235"/><rect class="dn" x="154" y="190" width="12" height="35"/>
  <line class="up wk" x1="210" y1="130" x2="210" y2="200"/><rect class="up" x="204" y="140" width="12" height="50"/>
  <line class="up wk" x1="260" y1="110" x2="260" y2="175"/><rect class="up" x="254" y="120" width="12" height="40"/>
  <line class="dn wk" x1="320" y1="115" x2="320" y2="175"/><rect class="dn" x="314" y="130" width="12" height="32"/>
  <line class="up wk" x1="380" y1="70" x2="380" y2="145"/><rect class="up" x="374" y="80" width="12" height="50"/>
  <line class="up wk" x1="440" y1="50" x2="440" y2="115"/><rect class="up" x="434" y="60" width="12" height="40"/>
  <line class="dn wk" x1="500" y1="60" x2="500" y2="110"/><rect class="dn" x="494" y="75" width="12" height="25"/>
  <line class="up wk" x1="560" y1="40" x2="560" y2="95"/><rect class="up" x="554" y="48" width="12" height="35"/>

  <text class="t" x="44" y="234">S1</text>
  <text class="t-g" x="168" y="164">旧阻力 → 新支撑候选</text>
  <text class="t-a" x="600" y="92">下一层</text>
  <text class="t" x="36" y="292">突破后立刻追，止损往往远在前一个低点。等新的小结构和近的失效位。</text>
  <text class="t-r" x="36" y="312">若新低跌破前一个有效支撑，阶梯坏了——减多头预期，不是「再等一等」。</text>
</svg>
