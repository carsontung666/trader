<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="急跌接近整美元后减速，微更高低点或收回关口才触发；直接跌破并在下方成交则失效">
  <title>整美元反转：关口是心理参考，不是硬地板</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .dol { stroke: #C08A12; stroke-width: 2; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tgt { stroke: #15803D; stroke-width: 1.4; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-a { fill: #E0A93A; } .t-r { fill: #EF6B5E; } .t-g { fill: #35C07B; }
      .dol { stroke: #DDA33A; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .stop { stroke: #EF6B5E; } .tgt { stroke: #35C07B; }
    }
  </style>
  <text class="t-b" x="36" y="24">这是急跌后在整数位的反转，不是动量课里「穿过整美元继续涨」。</text>
  <line class="dol" x1="40" y1="230" x2="720" y2="230"/>
  <text class="t-a" x="640" y="222">3.00</text>

  <line class="dn wk" x1="70" y1="70" x2="70" y2="130"/><rect class="dn" x="64" y="85" width="12" height="32"/>
  <line class="dn wk" x1="120" y1="110" x2="120" y2="175"/><rect class="dn" x="114" y="125" width="12" height="36"/>
  <line class="dn wk" x1="170" y1="155" x2="170" y2="220"/><rect class="dn" x="164" y="172" width="12" height="34"/>
  <text class="t-r" x="52" y="60">连续下跌</text>

  <line class="dn wk" x1="240" y1="195" x2="240" y2="248"/><rect class="dn" x="234" y="210" width="12" height="24"/>
  <text class="t-a" x="210" y="268">减速 / 影线</text>

  <line class="up wk" x1="310" y1="175" x2="310" y2="240"/><rect class="up" x="304" y="195" width="12" height="30"/>
  <line class="dn wk" x1="365" y1="185" x2="365" y2="228"/><rect class="dn" x="359" y="200" width="12" height="18"/>
  <text class="t-g" x="330" y="178">微更高低</text>

  <line class="up wk" x1="430" y1="140" x2="430" y2="210"/><rect class="up" x="424" y="155" width="12" height="40"/>
  <text class="t-g" x="410" y="130">触发：收回 / 破反转 K 高</text>
  <line class="up wk" x1="500" y1="110" x2="500" y2="175"/><rect class="up" x="494" y="125" width="12" height="36"/>

  <line class="tgt" x1="280" y1="155" x2="700" y2="155"/>
  <text class="t-g" x="560" y="148">第一目标：前一个微低，不是 HOD</text>
  <line class="stop" x1="220" y1="252" x2="400" y2="252"/>
  <text class="t-r" x="36" y="292">失效：关口下方被接受，或反转低点被破。可见买盘大单可以撤。</text>
  <text class="t" x="36" y="310">可成交限价限制最坏买价；未成交就放弃，不能向下无限改价。</text>
</svg>
