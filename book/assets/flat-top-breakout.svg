  <line class="dn wk" x1="220" y1="248.4" x2="220" y2="276.8"/><rect class="dn" x="214" y="251.6" width="12" height="18.9"/>
  <line class="up wk" x1="246" y1="245.3" x2="246" y2="273.7"/><rect class="up" x="240" y="251.6" width="12" height="18.9"/>
  <line class="dn wk" x1="272" y1="248.4" x2="272" y2="264.2"/><rect class="dn" x="266" y="251.6" width="12" height="9.5"/>
  <line class="up wk" x1="298" y1="248.4" x2="298" y2="264.2"/><rect class="up" x="292" y="251.6" width="12" height="9.5"/>
  <line class="dn wk" x1="324" y1="245.3" x2="324" y2="257.9"/><rect class="dn" x="318" y="251.6" width="12" height="3.1"/>
  <line class="up wk" x1="350" y1="248.4" x2="350" y2="257.9"/><rect class="up" x="344" y="251.6" width="12" height="3.1"/>
  <line class="dn wk" x1="376" y1="245.3" x2="376" y2="254.7"/><rect class="dn" x="370" y="248.4" width="12" height="3.2"/>
  <line class="up wk" x1="402" y1="245.3" x2="402" y2="254.7"/><rect class="up" x="396" y="248.4" width="12" height="3.2"/>
  <line class="dn wk" x1="428" y1="245.3" x2="428" y2="254.7"/><rect class="dn" x="422" y="248.4" width="12" height="3.2"/>
  <line class="up wk" x1="454" y1="175.8" x2="454" y2="254.7"/><rect class="up" x="448" y="182.1" width="12" height="69.5"/>
  <rect class="halo" x="443" y="171" width="22" height="88.5" rx="3"/>
  <line class="dn wk" x1="480" y1="163.2" x2="480" y2="201.1"/><rect class="dn" x="474" y="182.1" width="12" height="12.7"/>
  <line class="up wk" x1="506" y1="144.2" x2="506" y2="197.9"/><rect class="up" x="500" y="150.5" width="12" height="44.3"/>
  <line class="up wk" x1="532" y1="112.6" x2="532" y2="156.9"/><rect class="up" x="526" y="118.9" width="12" height="31.6"/>
  <line class="up wk" x1="558" y1="62.1"  x2="558" y2="125.2"/><rect class="up" x="552" y="68.4"  width="12" height="50.5"/>
  <line class="up wk" x1="584" y1="43.2"  x2="584" y2="81"/><rect class="up" x="578" y="49.5"  width="12" height="18.9"/>

  <text class="t t-r" x="628" y="312">④ 止损 8.10</text>
  <text class="t t-r" x="40" y="392">最近抬高低点 8.24；8.10 是再留滑点后的失效，不是贴着低点的像素。</text>

  <line class="mR" x1="660" y1="229.5" x2="660" y2="308.4"/>
  <line class="mR" x1="655" y1="229.5" x2="665" y2="229.5"/>
  <line class="mR" x1="655" y1="308.4" x2="665" y2="308.4"/>
  <text class="t t-r" x="672" y="266">风险</text>
  <text class="t t-r" x="672" y="282">0.25</text>

  <line class="mG" x1="722" y1="71.6" x2="722" y2="229.5"/>
  <line class="mG" x1="717" y1="71.6" x2="727" y2="71.6"/>
  <line class="mG" x1="717" y1="229.5" x2="727" y2="229.5"/>
  <text class="t t-g" x="686" y="146">收益 0.50</text>
