<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="急跌低吸要等低点停止、点差恢复、买盘能推回去；最大红K里猜底不是策略">
  <title>Flush Dip：等卖压释放，不是接飞刀</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .no { stroke: #C0392B; stroke-width: 2; }
    .ok { stroke: #15803D; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-r { fill: #EF6B5E; } .t-g { fill: #35C07B; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .no { stroke: #EF6B5E; } .ok { stroke: #35C07B; }
    }
  </style>
  <text class="t-a" x="40" y="28">长红 K 只说明卖压强，不等于已经便宜。</text>
  <line class="up wk" x1="70" y1="70" x2="70" y2="120"/><rect class="up" x="64" y="80" width="12" height="30"/>
  <line class="up wk" x1="110" y1="50" x2="110" y2="100"/><rect class="up" x="104" y="60" width="12" height="30"/>
  <line class="dn wk" x1="160" y1="70" x2="160" y2="180"/><rect class="dn" x="154" y="90" width="12" height="70"/>
  <line class="dn wk" x1="210" y1="150" x2="210" y2="250"/><rect class="dn" x="204" y="170" width="12" height="60"/>
  <line class="no" x1="200" y1="160" x2="230" y2="190"/>
  <line class="no" x1="230" y1="160" x2="200" y2="190"/>
  <text class="t-r" x="40" y="280">这里买 = 接飞刀</text>
  <line class="up wk" x1="280" y1="200" x2="280" y2="260"/><rect class="up" x="274" y="220" width="12" height="28"/>
  <line class="dn wk" x1="320" y1="210" x2="320" y2="255"/><rect class="dn" x="314" y="225" width="12" height="20"/>
  <line class="up wk" x1="370" y1="160" x2="370" y2="240"/><rect class="up" x="364" y="180" width="12" height="45"/>
  <line class="ok" x1="355" y1="175" x2="385" y2="175"/>
  <text class="t-g" x="400" y="180">低点停止 + 收回</text>
  <line class="up wk" x1="430" y1="120" x2="430" y2="190"/><rect class="up" x="424" y="135" width="12" height="40"/>
  <text class="t" x="260" y="304">还要看点差是否恢复。坏消息、融资、流动性消失：图形也可以长得很像超卖。</text>
</svg>
