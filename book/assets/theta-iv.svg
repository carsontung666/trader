<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="期权买方同时面对方向、时间损耗和隐含波动率下降">
  <title>方向对了也可能亏：时间与 IV</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .ax { stroke: #C5CCD3; stroke-width: 1.2; }
    .line { fill: none; stroke: #C0392B; stroke-width: 2.4; }
    .box { fill: none; stroke: #D0D5DB; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-r { fill: #EF6B5E; }
      .ax { stroke: #3A424C; } .line { stroke: #EF6B5E; } .box { stroke: #3A424C; }
    }
  </style>
  <rect class="box" x="20" y="20" width="350" height="220" rx="8"/>
  <text class="t-b" x="40" y="48">时间损耗 Theta</text>
  <line class="ax" x1="50" y1="200" x2="340" y2="200"/>
  <line class="ax" x1="50" y1="70" x2="50" y2="200"/>
  <path class="line" d="M60,90 C120,95 180,110 230,145 C280,185 320,198 335,200"/>
  <text class="t" x="40" y="222">越临近到期，外在价值掉得越快</text>

  <rect class="box" x="390" y="20" width="350" height="220" rx="8"/>
  <text class="t-b" x="410" y="48">IV crush（常见于财报后）</text>
  <text class="t" x="410" y="88">财报前：期权被卖贵</text>
  <text class="t" x="410" y="114">财报后：不确定性消失</text>
  <text class="t t-r" x="410" y="140">IV 急跌 → 权利金变便宜</text>
  <text class="t" x="410" y="176">方向猜对，实现波动不够</text>
  <text class="t" x="410" y="200">买方照样亏</text>
  <text class="t" x="20" y="262">先有正股六栏计划，再选合约。禁止先找最便宜的价外期权再编故事。</text>
</svg>
