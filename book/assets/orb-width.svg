<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="开盘区间过宽则止损太远；过窄则开盘噪声反复扫两侧">
  <title>ORB：区间过宽与过窄都不是靠事后改时长来修</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .box { fill: #F4F1E8; }
    .hi { stroke: #C08A12; stroke-width: 1.7; }
    .lo { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .box { fill: #2A2820; } .hi { stroke: #DDA33A; } .lo { stroke: #EF6B5E; }
    }
  </style>
  <rect class="box" x="24" y="48" width="150" height="196"/>
  <text class="t-r" x="24" y="28">左：区间过宽，失效太远</text>
  <line class="up wk" x1="54" y1="170" x2="54" y2="230"/><rect class="up" x="48" y="185" width="12" height="32"/>
  <line class="dn wk" x1="94" y1="90" x2="94" y2="236"/><rect class="dn" x="88" y="150" width="12" height="70"/>
  <line class="up wk" x1="134" y1="78" x2="134" y2="180"/><rect class="up" x="128" y="100" width="12" height="60"/>
  <line class="hi" x1="24" y1="78" x2="340" y2="78"/>
  <line class="lo" x1="24" y1="244" x2="250" y2="244"/>
  <line class="up wk" x1="230" y1="42" x2="230" y2="120"/><rect class="up" x="224" y="52" width="12" height="50"/>
  <text class="t" x="24" y="276">入在高上，止在远低：股数被公式砍到无意义</text>

  <rect class="box" x="400" y="110" width="150" height="70"/>
  <text class="t-a" x="400" y="28">右：区间过窄，噪声反复扫</text>
  <line class="up wk" x1="430" y1="120" x2="430" y2="175"/><rect class="up" x="424" y="135" width="12" height="28"/>
  <line class="dn wk" x1="470" y1="100" x2="470" y2="185"/><rect class="dn" x="464" y="125" width="12" height="40"/>
  <line class="up wk" x1="510" y1="108" x2="510" y2="168"/><rect class="up" x="504" y="122" width="12" height="30"/>
  <line class="hi" x1="400" y1="110" x2="730" y2="110"/>
  <line class="lo" x1="400" y1="180" x2="730" y2="180"/>
  <line class="up wk" x1="590" y1="70" x2="590" y2="145"/><rect class="up" x="584" y="82" width="12" height="42"/>
  <line class="dn wk" x1="640" y1="95" x2="640" y2="210"/><rect class="dn" x="634" y="130" width="12" height="55"/>
  <line class="up wk" x1="690" y1="55" x2="690" y2="140"/><rect class="up" x="684" y="68" width="12" height="48"/>
  <text class="t" x="400" y="276">刚破高又破低：这是开盘发现价格，不是 ORB</text>
  <text class="t" x="24" y="308">两种都不能靠亏钱后把 1 分钟改成 15 分钟来修。时长是参数，三套样本。</text>
</svg>
