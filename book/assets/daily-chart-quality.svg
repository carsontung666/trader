<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="左图日线上方空间清楚、200均线在下；右图重叠K线和长上影多、均线正在压制">
  <title>日线质量看空间和供给，不是公司评级</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.2; }
    .ma { fill: none; stroke: #C08A12; stroke-width: 1.8; }
    .box { fill: none; stroke: #D0D5DB; }
    .win { fill: #E8F0F6; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .ma { stroke: #DDA33A; } .box { stroke: #3A424C; } .win { fill: #1E2A33; }
    }
  </style>
  <rect class="box" x="20" y="20" width="350" height="280" rx="6"/>
  <text class="t-b t-g" x="32" y="42">更干净：空间清楚</text>
  <rect class="win" x="40" y="56" width="310" height="70"/>
  <text class="t" x="50" y="96">上方 window / 阻力间距大</text>
  <line class="up wk" x1="60" y1="200" x2="60" y2="250"/><rect class="up" x="54" y="210" width="12" height="30"/>
  <line class="up wk" x1="100" y1="170" x2="100" y2="230"/><rect class="up" x="94" y="180" width="12" height="40"/>
  <line class="dn wk" x1="140" y1="160" x2="140" y2="210"/><rect class="dn" x="134" y="170" width="12" height="30"/>
  <line class="up wk" x1="180" y1="140" x2="180" y2="200"/><rect class="up" x="174" y="150" width="12" height="40"/>
  <line class="up wk" x1="220" y1="120" x2="220" y2="175"/><rect class="up" x="214" y="130" width="12" height="35"/>
  <line class="up wk" x1="260" y1="150" x2="260" y2="200"/><rect class="up" x="254" y="160" width="12" height="28"/>
  <line class="up wk" x1="300" y1="130" x2="300" y2="185"/><rect class="up" x="294" y="140" width="12" height="32"/>
  <polyline class="ma" points="50,250 120,240 190,230 260,220 330,215"/>
  <text class="t" x="32" y="278">200 EMA 在下方或仍有空间</text>

  <rect class="box" x="390" y="20" width="350" height="280" rx="6"/>
  <text class="t-b t-r" x="402" y="42">杂乱：供给密、假突破多</text>
  <line class="dn wk" x1="420" y1="70" x2="420" y2="150"/><rect class="dn" x="414" y="90" width="12" height="40"/>
  <line class="up wk" x1="460" y1="50" x2="460" y2="160"/><rect class="up" x="454" y="120" width="12" height="30"/>
  <line class="dn wk" x1="500" y1="80" x2="500" y2="190"/><rect class="dn" x="494" y="110" width="12" height="55"/>
  <line class="up wk" x1="540" y1="60" x2="540" y2="180"/><rect class="up" x="534" y="130" width="12" height="35"/>
  <line class="dn wk" x1="580" y1="90" x2="580" y2="210"/><rect class="dn" x="574" y="130" width="12" height="55"/>
  <line class="up wk" x1="620" y1="70" x2="620" y2="200"/><rect class="up" x="614" y="140" width="12" height="40"/>
  <line class="dn wk" x1="660" y1="100" x2="660" y2="230"/><rect class="dn" x="654" y="150" width="12" height="55"/>
  <polyline class="ma" points="410,80 490,95 570,88 650,100 720,92"/>
  <text class="t" x="402" y="258">长上影多，200 EMA 正在压</text>
  <text class="t" x="402" y="278">「不好看」要写成：阻力近、reward 小</text>

  <text class="t" x="20" y="322">Former runner 只说明以前跑过。核对拆股复权；反向拆股后的旧价不能直接当自然阻力。</text>
</svg>
