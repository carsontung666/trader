<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Covered Call：上涨利润被行权价截断，下跌时权利金只垫很薄一层">
  <title>Covered Call 仍承担股票大跌</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .ax { stroke: #C5CCD3; stroke-width: 1.2; }
    .pay { stroke: #3D6A94; stroke-width: 2.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .ax { stroke: #3A424C; } .pay { stroke: #7FA9CE; }
    }
  </style>
  <line class="ax" x1="80" y1="160" x2="700" y2="160"/>
  <line class="ax" x1="200" y1="40" x2="200" y2="270"/>
  <polyline class="pay" points="80,250 200,160 420,70 700,70"/>
  <text class="t" x="88" y="274">股票 → 0</text>
  <text class="t-r" x="90" y="230">大跌时几乎 1:1 亏</text>
  <text class="t" x="188" y="290">成本</text>
  <text class="t-g" x="430" y="60">上涨被行权价截断</text>
  <text class="t" x="430" y="84">换来的只是权利金</text>
  <text class="t-b" x="80" y="36">到期：100 股 + 卖出 1 张 Call</text>
  <text class="t" x="80" y="56">「卖 Call = 看跌」不严谨。你仍是正 Delta，只是不认为会大涨。</text>
</svg>
