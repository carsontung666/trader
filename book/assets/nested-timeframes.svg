<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="五根已收盘的1分钟K合成一根5分钟K；当前未收盘的K线还会变">
  <title>周期嵌套：未收盘不算确认</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .ghost { fill: none; stroke: #8A94A0; stroke-width: 1.4; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .ghost { stroke: #6E7884; }
    }
  </style>
  <text class="t-b" x="40" y="32">1 分钟（已收盘四根 + 正在走的第五根）</text>
  <line class="up wk" x1="70" y1="80" x2="70" y2="140"/><rect class="up" x="64" y="90" width="12" height="40"/>
  <line class="up wk" x1="110" y1="60" x2="110" y2="120"/><rect class="up" x="104" y="70" width="12" height="40"/>
  <line class="dn wk" x1="150" y1="70" x2="150" y2="150"/><rect class="dn" x="144" y="85" width="12" height="50"/>
  <line class="up wk" x1="190" y1="90" x2="190" y2="160"/><rect class="up" x="184" y="100" width="12" height="45"/>
  <rect class="ghost" x="220" y="70" width="16" height="70"/>
  <text class="t-a" x="248" y="110">未收盘</text>

  <text class="t" x="40" y="200">合成一根 5 分钟时：只用已经收盘的部分。第五根还在变，5 分钟形态可以改写。</text>

  <text class="t-b" x="430" y="32">同一段，画成 5 分钟</text>
  <line class="up wk" x1="520" y1="50" x2="520" y2="170"/><rect class="up" x="506" y="70" width="28" height="80"/>
  <text class="t-a" x="430" y="210">现在这根还没走完</text>
  <text class="t" x="430" y="250">大周期定区域</text>
  <text class="t" x="430" y="272">小周期定触发和失效</text>
  <text class="t" x="430" y="294">不要 1 分钟进、5 分钟止损</text>
</svg>
