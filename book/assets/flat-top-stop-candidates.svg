<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="三个止损候选：8.25 太紧会被正常回抽扫掉；8.10 在最近抬高低点 8.24 再留滑点；7.90 太远让风险翻倍">
  <title>止损选「错了才打到的价」，不是选亏得最少的价</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .ax { fill: #6B7581; font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .hod { stroke: #C08A12; stroke-width: 2; }
    .hl { stroke: #3D6A94; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .bad { stroke: #C0392B; stroke-width: 1.4; stroke-dasharray: 3 3; }
    .ok { stroke: #15803D; stroke-width: 1.8; }
    .far { stroke: #8A94A0; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .c { fill: #F7F8FA; stroke: #D0D5DB; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .t-r { fill: #EF6B5E; } .t-g { fill: #35C07B; } .t-a { fill: #E0A93A; }
      .ax { fill: #8B95A1; }
      .hod { stroke: #DDA33A; } .hl { stroke: #7FA9CE; }
      .bad { stroke: #EF6B5E; } .ok { stroke: #35C07B; } .far { stroke: #6E7884; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .c { fill: #1C2228; stroke: #3A424C; }
    }
  </style>

  <text class="t-b" x="24" y="24">最近抬高低点是 8.24。失效画在它下方再留滑点，不是贴着像素。</text>

  <text class="ax t-a" x="56" y="78" text-anchor="end">8.30</text>
  <text class="ax" x="56" y="126" text-anchor="end">8.25</text>
  <text class="ax" x="56" y="158" text-anchor="end">8.24</text>
  <text class="ax t-g" x="56" y="210" text-anchor="end">8.10</text>
  <text class="ax" x="56" y="258" text-anchor="end">7.90</text>

  <line class="hod" x1="68" y1="74" x2="430" y2="74"/>
  <line class="bad" x1="68" y1="122" x2="430" y2="122"/>
  <line class="hl" x1="68" y1="154" x2="430" y2="154"/>
  <line class="ok" x1="68" y1="206" x2="430" y2="206"/>
  <line class="far" x1="68" y1="254" x2="430" y2="254"/>

  <line class="up wk" x1="110" y1="74" x2="110" y2="188"/><rect class="up" x="104" y="90" width="12" height="80"/>
  <line class="dn wk" x1="150" y1="78" x2="150" y2="188"/><rect class="dn" x="144" y="90" width="12" height="78"/>
  <line class="up wk" x1="190" y1="74" x2="190" y2="170"/><rect class="up" x="184" y="88" width="12" height="64"/>
  <line class="dn wk" x1="230" y1="78" x2="230" y2="166"/><rect class="dn" x="224" y="90" width="12" height="56"/>
  <line class="up wk" x1="270" y1="74" x2="270" y2="154"/><rect class="up" x="264" y="86" width="12" height="48"/>
  <line class="dn wk" x1="310" y1="76" x2="310" y2="154"/><rect class="dn" x="304" y="86" width="12" height="40"/>
  <line class="up wk" x1="350" y1="40" x2="350" y2="90"/><rect class="up" x="344" y="48" width="12" height="32"/>

  <text class="t-a" x="438" y="78">上沿 8.30</text>
  <text class="t-r" x="438" y="126">8.25 太紧：回抽常见</text>
  <text class="t" x="438" y="158">8.24 = 最近抬高低点</text>
  <text class="t-g" x="438" y="210">8.10 = 低点 + 滑点缓冲</text>
  <text class="t" x="438" y="258">7.90 太远：风险约翻倍</text>

  <rect class="c" x="24" y="272" width="712" height="22" rx="4"/>
  <text class="t" x="36" y="288">选的标准不是「哪个亏得少」，是「打到哪里才能确定买方进逼这个前提死了」。</text>
</svg>
