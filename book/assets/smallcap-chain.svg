<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="小盘动量链：催化、量能集中、突破、回撤整理、再次扩张">
  <title>小盘交易的是注意力链，不是低价本身</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .n { fill: #EEF3F8; stroke: #3D6A94; }
    .w { fill: #FFF7E0; stroke: #B07D0A; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .n { fill: #1C2833; stroke: #7FA9CE; }
      .w { fill: #3A3420; stroke: #E0A93A; }
    }
  </style>
  <rect class="n" x="12" y="28" width="128" height="78" rx="8"/><text class="t-b" x="42" y="62">催化 / 异动</text><text class="t" x="28" y="84">注意力从哪来</text>
  <text class="t-b" x="144" y="72">→</text>
  <rect class="n" x="164" y="28" width="128" height="78" rx="8"/><text class="t-b" x="190" y="62">成交量集中</text><text class="t" x="178" y="84">能不能进出</text>
  <text class="t-b" x="296" y="72">→</text>
  <rect class="n" x="316" y="28" width="128" height="78" rx="8"/><text class="t-b" x="352" y="62">价格突破</text><text class="t" x="334" y="84">线被接受才算</text>
  <text class="t-b" x="448" y="72">→</text>
  <rect class="n" x="468" y="28" width="128" height="78" rx="8"/><text class="t-b" x="492" y="62">回撤整理</text><text class="t" x="480" y="84">失效点变近</text>
  <text class="t-b" x="600" y="72">→</text>
  <rect class="n" x="620" y="28" width="128" height="78" rx="8"/><text class="t-b" x="644" y="62">再次扩张</text><text class="t" x="632" y="84">跟得上才持有</text>
  <rect class="w" x="12" y="128" width="736" height="70" rx="8"/>
  <text class="t-b" x="28" y="156">缺任何一环就不是这套方法</text>
  <text class="t" x="28" y="178">没有注意力：图形再漂亮也是薄盘噪声。没有可承受失效点：突破只是追高。假突破时退不出：整条链作废。</text>
</svg>
