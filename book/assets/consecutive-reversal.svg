<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="连续同向K线是筛选不是触发；触发要等反向K被破或结构改变">
  <title>连续 K 是极端筛选，不是进场按钮</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .stop { stroke: #EF6B5E; }
    }
  </style>
  <text class="t-a" x="40" y="28">5 根 5 分钟 / 10 根 1 分钟：启发式筛选。第五根仍可能是趋势中段。</text>
  <line class="dn wk" x1="60" y1="50" x2="60" y2="90"/><rect class="dn" x="54" y="58" width="12" height="24"/>
  <line class="dn wk" x1="100" y1="70" x2="100" y2="120"/><rect class="dn" x="94" y="80" width="12" height="28"/>
  <line class="dn wk" x1="140" y1="95" x2="140" y2="150"/><rect class="dn" x="134" y="108" width="12" height="30"/>
  <line class="dn wk" x1="180" y1="125" x2="180" y2="185"/><rect class="dn" x="174" y="140" width="12" height="32"/>
  <line class="dn wk" x1="220" y1="155" x2="220" y2="220"/><rect class="dn" x="214" y="170" width="12" height="36"/>
  <line class="up wk" x1="280" y1="170" x2="280" y2="230"/><rect class="up" x="274" y="190" width="12" height="28"/>
  <line class="up wk" x1="330" y1="140" x2="330" y2="200"/><rect class="up" x="324" y="155" width="12" height="35"/>
  <line class="up wk" x1="380" y1="110" x2="380" y2="170"/><rect class="up" x="374" y="125" width="12" height="35"/>
  <line class="stop" x1="50" y1="50" x2="500" y2="50"/>
  <text class="t-r" x="508" y="54">极端高点 = 失效</text>
  <text class="t-g" x="260" y="256">触发：反向 K 的高点被穿过，或出现更高低点</text>
  <text class="t" x="40" y="282">在第 5 / 10 根里逆势抢：价格最好，失败最多。必须分开统计。</text>
</svg>
