<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="有效突破后回踩旧阻力，收回则买；失败突破跌回平台内则不是回踩">
  <title>突破后的回踩，不是失败突破</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .lvl { stroke: #C08A12; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; }
      .t-g { fill: #35C07B; }
      .t-r { fill: #EF6B5E; }
      .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .lvl { stroke: #DDA33A; }
    }
  </style>
  <text class="t-a" x="40" y="32">左边：真突破后的回踩。右边：失败突破，不是 dip buy。</text>
  <line class="lvl" x1="40" y1="180" x2="360" y2="180"/>
  <line class="up wk" x1="60" y1="200" x2="60" y2="250"/><rect class="up" x="54" y="210" width="12" height="30"/>
  <line class="up wk" x1="95" y1="150" x2="95" y2="215"/><rect class="up" x="89" y="160" width="12" height="40"/>
  <line class="up wk" x1="130" y1="90" x2="130" y2="170"/><rect class="up" x="124" y="100" width="12" height="55"/>
  <line class="dn wk" x1="165" y1="110" x2="165" y2="185"/><rect class="dn" x="159" y="125" width="12" height="40"/>
  <line class="up wk" x1="200" y1="120" x2="200" y2="190"/><rect class="up" x="194" y="135" width="12" height="35"/>
  <line class="up wk" x1="235" y1="70" x2="235" y2="145"/><rect class="up" x="229" y="80" width="12" height="50"/>
  <text class="t-g" x="50" y="280">回踩旧阻力后收回，低点没坏结构</text>

  <line class="lvl" x1="400" y1="180" x2="720" y2="180"/>
  <line class="up wk" x1="430" y1="200" x2="430" y2="250"/><rect class="up" x="424" y="210" width="12" height="30"/>
  <line class="up wk" x1="465" y1="150" x2="465" y2="215"/><rect class="up" x="459" y="160" width="12" height="40"/>
  <line class="up wk" x1="500" y1="90" x2="500" y2="175"/><rect class="up" x="494" y="105" width="12" height="50"/>
  <line class="dn wk" x1="535" y1="110" x2="535" y2="230"/><rect class="dn" x="529" y="130" width="12" height="80"/>
  <line class="dn wk" x1="570" y1="200" x2="570" y2="280"/><rect class="dn" x="564" y="215" width="12" height="50"/>
  <text class="t-r" x="410" y="310">插上去立刻跌回平台内 = 失败突破</text>
</svg>
