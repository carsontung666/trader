<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="没有近端失效就默认不做急跌低吸；左边低点已停失效近，右边还在下砸只能画到很远">
  <title>Flush Dip：没有近端失效，默认仓位是 0</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .ok { fill: #E7F6EC; stroke: #15803D; }
    .no { fill: #FDE8E8; stroke: #C0392B; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .inv { stroke: #C0392B; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ent { stroke: #3D6A94; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; } .t-a { fill: #E0A93A; }
      .ok { fill: #1C3326; stroke: #35C07B; }
      .no { fill: #3A2424; stroke: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .inv { stroke: #EF6B5E; }
      .ent { stroke: #7FA9CE; }
    }
  </style>
  <text class="t-b" x="24" y="28">默认不做。除非失效位已经近到你能按公式算出股数，且第一目标盖过 1R。</text>

  <rect class="ok" x="16" y="44" width="356" height="248" rx="8"/>
  <text class="t-g" x="36" y="70">低点已停，失效可画</text>
  <line class="dn wk" x1="56" y1="88" x2="56" y2="180"/><rect class="dn" x="50" y="104" width="12" height="60"/>
  <line class="up wk" x1="100" y1="156" x2="100" y2="200"/><rect class="up" x="94" y="168" width="12" height="22"/>
  <line class="dn wk" x1="140" y1="164" x2="140" y2="198"/><rect class="dn" x="134" y="174" width="12" height="16"/>
  <line class="up wk" x1="190" y1="120" x2="190" y2="190"/><rect class="up" x="184" y="136" width="12" height="40"/>
  <line class="ent" x1="36" y1="136" x2="340" y2="136"/>
  <text class="t" x="250" y="128">入场 8.20</text>
  <line class="inv" x1="36" y1="202" x2="340" y2="202"/>
  <text class="t-r" x="250" y="220">失效 8.05</text>
  <text class="t" x="36" y="236">每股风险约 0.15 + 滑点</text>
  <text class="t" x="36" y="256">第一目标先量微高，不是 HOD</text>
  <text class="t-g" x="36" y="276">可以谈仓位，仍要砍 halt 上限</text>

  <rect class="no" x="388" y="44" width="356" height="248" rx="8"/>
  <text class="t-r" x="408" y="70">还在下砸，没有近端失效</text>
  <line class="dn wk" x1="428" y1="88" x2="428" y2="150"/><rect class="dn" x="422" y="100" width="12" height="40"/>
  <line class="dn wk" x1="472" y1="130" x2="472" y2="200"/><rect class="dn" x="466" y="146" width="12" height="42"/>
  <line class="dn wk" x1="516" y1="176" x2="516" y2="250"/><rect class="dn" x="510" y="192" width="12" height="44"/>
  <line class="ent" x1="408" y1="120" x2="720" y2="120"/>
  <text class="t" x="620" y="112">想买 8.20</text>
  <line class="inv" x1="408" y1="262" x2="720" y2="262"/>
  <text class="t-r" x="600" y="254">只能画到 7.40？</text>
  <text class="t" x="408" y="236">每股风险已经像另一笔交易</text>
  <text class="t" x="408" y="256">把止损上移来伪造 2R，不是计划</text>
  <text class="t-r" x="408" y="276">仓位是 0，不是「先买一点」</text>

  <text class="t-a" x="24" y="320">事后补一条刚好托住当前低点的线，再宣布「失效很近」，是拟合，不是近端失效。</text>
</svg>
