<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="左：从上方跌到日线200EMA做多要等盘中结构。右：从下方接近做空要等拒绝">
  <title>日线 200 EMA：碰线是语境，盘中结构才是触发</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .ema { fill: none; stroke: #7C3AED; stroke-width: 1.8; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .div { stroke: #C5CCD3; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-a { fill: #E0A93A; } .t-r { fill: #EF6B5E; } .t-g { fill: #35C07B; }
      .ema { stroke: #C4B5FD; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .div { stroke: #3A424C; }
    }
  </style>
  <text class="t-b" x="36" y="24">200 EMA 是启发式的广泛参考。从哪一侧接近，假设完全相反。</text>
  <line class="div" x1="380" y1="40" x2="380" y2="300"/>

  <text class="t-g" x="70" y="48">从上方回来：做多假设</text>
  <path class="ema" d="M40,200 C120,196 220,198 360,202"/>
  <text class="t" x="300" y="192">200 EMA</text>
  <line class="up wk" x1="70" y1="70" x2="70" y2="120"/><rect class="up" x="64" y="82" width="12" height="26"/>
  <line class="dn wk" x1="120" y1="90" x2="120" y2="170"/><rect class="dn" x="114" y="115" width="12" height="40"/>
  <line class="dn wk" x1="175" y1="150" x2="175" y2="215"/><rect class="dn" x="169" y="175" width="12" height="28"/>
  <line class="up wk" x1="235" y1="155" x2="235" y2="210"/><rect class="up" x="229" y="170" width="12" height="26"/>
  <line class="up wk" x1="295" y1="120" x2="295" y2="185"/><rect class="up" x="289" y="138" width="12" height="32"/>
  <text class="t-g" x="50" y="250">触发：盘中更高低 + 收回</text>
  <text class="t-r" x="50" y="270">失效：均线下方结构低</text>
  <text class="t" x="50" y="290">也可能是趋势真正破坏</text>

  <text class="t-r" x="430" y="48">从下方接近：做空假设</text>
  <path class="ema" d="M400,130 C500,126 600,124 740,122"/>
  <text class="t" x="680" y="114">200 EMA</text>
  <line class="up wk" x1="440" y1="210" x2="440" y2="260"/><rect class="up" x="434" y="222" width="12" height="26"/>
  <line class="up wk" x1="500" y1="170" x2="500" y2="230"/><rect class="up" x="494" y="185" width="12" height="32"/>
  <line class="up wk" x1="560" y1="125" x2="560" y2="190"/><rect class="up" x="554" y="145" width="12" height="32"/>
  <line class="dn wk" x1="620" y1="100" x2="620" y2="185"/><rect class="dn" x="614" y="120" width="12" height="48"/>
  <line class="dn wk" x1="680" y1="160" x2="680" y2="240"/><rect class="dn" x="674" y="180" width="12" height="42"/>
  <text class="t-r" x="420" y="270">触发：拒绝后向下接受</text>
  <text class="t-r" x="420" y="290">失效：均线上方结构高</text>

  <text class="t" x="36" y="322">平台的盘前数据、复权、起始样本会画出不同的线。碰线就下单，两边都会连续止损。</text>
</svg>
