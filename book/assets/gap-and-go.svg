<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="高开不是信号；盘前高点画好，开盘穿过并接受才触发，远离失效位是追">
  <title>Gap and Go：触发在盘前高点被接受</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .pm { fill: #F4F1E8; }
    .hod { stroke: #C08A12; stroke-width: 1.8; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .pm { fill: #2A2820; } .hod { stroke: #DDA33A; } .stop { stroke: #EF6B5E; }
    }
  </style>
  <rect class="pm" x="40" y="50" width="240" height="220"/>
  <text class="t-a" x="50" y="36">盘前：先画高点、低点</text>
  <text class="t" x="58" y="80">昨收 8.00</text>
  <line class="up wk" x1="80" y1="160" x2="80" y2="210"/><rect class="up" x="74" y="170" width="12" height="30"/>
  <line class="up wk" x1="120" y1="120" x2="120" y2="180"/><rect class="up" x="114" y="130" width="12" height="40"/>
  <line class="dn wk" x1="160" y1="130" x2="160" y2="185"/><rect class="dn" x="154" y="145" width="12" height="28"/>
  <line class="up wk" x1="200" y1="118" x2="200" y2="170"/><rect class="up" x="194" y="130" width="12" height="28"/>
  <line class="hod" x1="40" y1="118" x2="700" y2="118"/>
  <text class="t-a" x="500" y="110">盘前高 8.60</text>
  <line class="stop" x1="40" y1="210" x2="430" y2="210"/>
  <text class="t-r" x="50" y="230">盘前低 = 失效</text>

  <text class="t-g" x="300" y="36">开盘后：穿过并接受，才是触发</text>
  <line class="up wk" x1="320" y1="90" x2="320" y2="160"/><rect class="up" x="314" y="100" width="12" height="45"/>
  <line class="up wk" x1="370" y1="60" x2="370" y2="120"/><rect class="up" x="364" y="70" width="12" height="40"/>
  <line class="up wk" x1="420" y1="40" x2="420" y2="90"/><rect class="up" x="414" y="50" width="12" height="30"/>

  <text class="t-r" x="500" y="160">右边：开盘已远离</text>
  <text class="t-r" x="500" y="182">所有失效位 = 追</text>
  <line class="up wk" x1="620" y1="30" x2="620" y2="70"/><rect class="up" x="614" y="38" width="12" height="24"/>
  <text class="t" x="40" y="300">高开百分比不是信号。点差一宽、正在停牌、盘前已经翻了数倍：直接放弃。</text>
  <text class="t" x="40" y="322">第一次回撤和第二次回撤分开统计，不要因为第一笔赚了就加第二笔。</text>
</svg>
