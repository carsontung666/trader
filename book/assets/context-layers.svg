<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="同一旗形因日线位置、时段、第几次回撤而不是同一笔">
  <title>形态脱离语境没有统一胜率</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .l1 { fill: #D6E8F5; stroke: #3D6A94; }
    .l2 { fill: #C5E4D4; stroke: #15803D; }
    .l3 { fill: #F8E7B0; stroke: #B07D0A; }
    .l4 { fill: #F5D0C8; stroke: #C0392B; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .l1 { fill: #1C2833; stroke: #7FA9CE; }
      .l2 { fill: #1C3326; stroke: #35C07B; }
      .l3 { fill: #3A3420; stroke: #E0A93A; }
      .l4 { fill: #3A2424; stroke: #EF6B5E; }
    }
  </style>
  <rect class="l1" x="20" y="20" width="720" height="56" rx="8"/>
  <text class="t-b" x="36" y="54">日线：上方空间、200 均线、历史套牢、是否刚冲高回落、复权是否可靠</text>
  <rect class="l2" x="50" y="88" width="660" height="56" rx="8"/>
  <text class="t-b" x="66" y="122">时段：盘前回撤 / 开盘第一次 / 第三次停牌后 / 午后枯量</text>
  <rect class="l3" x="90" y="156" width="580" height="56" rx="8"/>
  <text class="t-b" x="106" y="190">序列：第几次回撤 · 催化是否还在 · 相对量口径</text>
  <rect class="l4" x="140" y="224" width="480" height="56" rx="8"/>
  <text class="t-b" x="156" y="258">触发：同一周期的线、失效、第一目标 R</text>
</svg>
