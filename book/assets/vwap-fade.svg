<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="价格从下方反弹到VWAP受阻后转弱是fade；同一日稍后再次上破是另一笔">
  <title>VWAP fade：碰线失败是一笔，再突破是另一笔</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .vw { fill: none; stroke: #3D6A94; stroke-width: 2.2; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-a { fill: #E0A93A; } .t-r { fill: #EF6B5E; } .t-g { fill: #35C07B; }
      .vw { stroke: #7FA9CE; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
    }
  </style>
  <text class="t-b" x="36" y="24">同一日 VWAP 可先做阻力、后做支撑。角色随接受变化，不是永久标签。</text>
  <polyline class="vw" points="40,120 160,122 300,124 440,126 580,128 720,130"/>
  <text class="t" x="660" y="114">VWAP</text>

  <line class="up wk" x1="70" y1="70" x2="70" y2="130"/><rect class="up" x="64" y="82" width="12" height="32"/>
  <line class="dn wk" x1="120" y1="95" x2="120" y2="190"/><rect class="dn" x="114" y="130" width="12" height="45"/>
  <line class="dn wk" x1="170" y1="160" x2="170" y2="230"/><rect class="dn" x="164" y="175" width="12" height="38"/>
  <line class="up wk" x1="240" y1="145" x2="240" y2="220"/><rect class="up" x="234" y="168" width="12" height="36"/>
  <line class="up wk" x1="300" y1="125" x2="300" y2="185"/><rect class="up" x="294" y="140" width="12" height="30"/>
  <text class="t-a" x="220" y="250">反弹到线</text>

  <line class="dn wk" x1="360" y1="110" x2="360" y2="195"/><rect class="dn" x="354" y="128" width="12" height="50"/>
  <text class="t-r" x="330" y="98">fade 触发：拒绝后向下接受</text>
  <line class="dn wk" x1="420" y1="155" x2="420" y2="235"/><rect class="dn" x="414" y="175" width="12" height="42"/>

  <line class="up wk" x1="520" y1="90" x2="520" y2="175"/><rect class="up" x="514" y="108" width="12" height="50"/>
  <line class="dn wk" x1="575" y1="105" x2="575" y2="155"/><rect class="dn" x="569" y="120" width="12" height="22"/>
  <line class="up wk" x1="630" y1="60" x2="630" y2="140"/><rect class="up" x="624" y="75" width="12" height="48"/>
  <text class="t-g" x="500" y="250">再突破是另一笔，记 attempt #</text>

  <text class="t" x="36" y="288">Fade 失效：重新站上 VWAP 并接受。不要把第一次失败永久定义成「弱」。</text>
  <text class="t" x="36" y="308">上方历史水平限制目标。收回 VWAP 不等于必须回到高点。</text>
</svg>
