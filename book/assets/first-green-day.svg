<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="曾in-play后多日回落，触发是突破前一日高点，不是K线暂时变绿">
  <title>First Green Day 是研究假设：触发在前日高</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.5; }
    .pdh { stroke: #C08A12; stroke-width: 1.8; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .pdh { stroke: #DDA33A; }
    }
  </style>
  <text class="t-a" x="40" y="32">日线：先有过一天高量 in-play，再连日回落</text>
  <line class="up wk" x1="70" y1="50" x2="70" y2="130"/><rect class="up" x="62" y="60" width="16" height="55"/>
  <text class="t" x="52" y="150">高量日</text>
  <line class="dn wk" x1="130" y1="90" x2="130" y2="170"/><rect class="dn" x="122" y="105" width="16" height="50"/>
  <line class="dn wk" x1="190" y1="130" x2="190" y2="200"/><rect class="dn" x="182" y="145" width="16" height="40"/>
  <line class="dn wk" x1="250" y1="155" x2="250" y2="220"/><rect class="dn" x="242" y="168" width="16" height="38"/>
  <line class="up wk" x1="310" y1="160" x2="310" y2="225"/><rect class="up" x="302" y="175" width="16" height="35"/>
  <text class="t" x="290" y="248">前日</text>
  <line class="pdh" x1="290" y1="160" x2="700" y2="160"/>
  <text class="t-a" x="520" y="152">前一日高点</text>
  <line class="up wk" x1="400" y1="80" x2="400" y2="190"/><rect class="up" x="392" y="95" width="16" height="70"/>
  <text class="t-g" x="430" y="120">触发：穿过前日高</text>
  <text class="t" x="430" y="142">不是「K 线暂时变绿」</text>
  <text class="t" x="40" y="280">未收盘日线随时可以变红。这是观察名单的研究假设，不是开盘市价许可。</text>
</svg>
