<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="左：昨收附近反复穿越不是开关。右：flush 停止后更高低点，并在昨收上方接受；止损在 flush 低点">
  <title>红翻绿：反复穿越不是开关；触发是接受</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .pc { stroke: #C08A12; stroke-width: 2; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .box { fill: none; stroke: #D0D5DB; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; }
      .t-a { fill: #E0A93A; }
      .t-g { fill: #35C07B; }
      .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .pc { stroke: #DDA33A; }
      .stop { stroke: #EF6B5E; }
      .box { stroke: #3A424C; }
    }
  </style>
  <rect class="box" x="16" y="44" width="352" height="250" rx="6"/>
  <text class="t-r" x="28" y="32">不是开关：昨收被反复穿过</text>
  <line class="pc" x1="36" y1="150" x2="350" y2="150"/>
  <text class="t-a" x="292" y="142">昨收</text>
  <line class="dn wk" x1="60" y1="155" x2="60" y2="205"/><rect class="dn" x="54" y="168" width="12" height="28"/>
  <line class="up wk" x1="100" y1="118" x2="100" y2="175"/><rect class="up" x="94" y="128" width="12" height="32"/>
  <line class="dn wk" x1="140" y1="145" x2="140" y2="210"/><rect class="dn" x="134" y="158" width="12" height="38"/>
  <line class="up wk" x1="180" y1="108" x2="180" y2="168"/><rect class="up" x="174" y="118" width="12" height="36"/>
  <line class="dn wk" x1="220" y1="148" x2="220" y2="218"/><rect class="dn" x="214" y="162" width="12" height="40"/>
  <line class="up wk" x1="260" y1="122" x2="260" y2="172"/><rect class="up" x="254" y="132" width="12" height="28"/>
  <line class="dn wk" x1="300" y1="150" x2="300" y2="208"/><rect class="dn" x="294" y="164" width="12" height="32"/>
  <text class="t" x="28" y="278">单次刺穿、马上还回去：弱势叙事没被破坏</text>

  <rect class="box" x="392" y="44" width="352" height="250" rx="6"/>
  <text class="t-g" x="404" y="32">才是结构：flush 停，再在上方接受</text>
  <line class="pc" x1="412" y1="140" x2="726" y2="140"/>
  <text class="t-a" x="668" y="132">昨收</text>
  <line class="dn wk" x1="440" y1="148" x2="440" y2="198"/><rect class="dn" x="434" y="158" width="12" height="30"/>
  <line class="dn wk" x1="480" y1="175" x2="480" y2="268"/><rect class="dn" x="474" y="190" width="12" height="62"/>
  <line class="up wk" x1="520" y1="198" x2="520" y2="270"/><rect class="up" x="514" y="214" width="12" height="38"/>
  <line class="up wk" x1="560" y1="162" x2="560" y2="228"/><rect class="up" x="554" y="176" width="12" height="38"/>
  <line class="up wk" x1="600" y1="108" x2="600" y2="178"/><rect class="up" x="594" y="118" width="12" height="48"/>
  <line class="up wk" x1="640" y1="78" x2="640" y2="138"/><rect class="up" x="634" y="88" width="12" height="38"/>
  <line class="up wk" x1="680" y1="58" x2="680" y2="112"/><rect class="up" x="674" y="68" width="12" height="32"/>
  <line class="stop" x1="468" y1="272" x2="700" y2="272"/>
  <text class="t-r" x="560" y="264">flush 低点 = 失效</text>
  <text class="t" x="404" y="278">更高低点之后，实体站上昨收</text>

  <text class="t" x="16" y="328">昨收昨天就画好。触发仍是下跌失败 + 上方成交，不是颜色从红变绿的那一跳。</text>
  <text class="t" x="16" y="348">左图每一次穿越都不是入场。右图止损钉在已经形成的 flush 低，不钉在「当天最低」的移动影子上。</text>
</svg>
