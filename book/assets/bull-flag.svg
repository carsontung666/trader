<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="旗杆是一段上涨，旗面是缩量回撤，触发在旗面上沿，止损在旗面低点下">
  <title>Bull Flag：触发在旗面上沿，不是旗杆中途</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #3D6A94; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .flag { fill: none; stroke: #8A94A0; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ent { stroke: #15803D; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; }
      .t-b { fill: #7FA9CE; }
      .t-r { fill: #EF6B5E; }
      .t-g { fill: #35C07B; }
      .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .flag { stroke: #6E7884; }
      .stop { stroke: #EF6B5E; }
      .ent { stroke: #35C07B; }
    }
  </style>
  <text class="t-a" x="40" y="36">① 旗杆：一段明显上涨</text>
  <line class="up wk" x1="70" y1="250" x2="70" y2="300"/><rect class="up" x="64" y="260" width="12" height="30"/>
  <line class="up wk" x1="100" y1="200" x2="100" y2="265"/><rect class="up" x="94" y="210" width="12" height="45"/>
  <line class="up wk" x1="130" y1="150" x2="130" y2="220"/><rect class="up" x="124" y="160" width="12" height="50"/>
  <line class="up wk" x1="160" y1="110" x2="160" y2="175"/><rect class="up" x="154" y="120" width="12" height="45"/>

  <rect class="flag" x="175" y="108" width="220" height="95"/>
  <text class="t-b" x="190" y="100">② 旗面：回撤或横盘，量通常收缩</text>
  <line class="dn wk" x1="200" y1="120" x2="200" y2="175"/><rect class="dn" x="194" y="128" width="12" height="35"/>
  <line class="up wk" x1="235" y1="135" x2="235" y2="185"/><rect class="up" x="229" y="145" width="12" height="28"/>
  <line class="dn wk" x1="270" y1="140" x2="270" y2="190"/><rect class="dn" x="264" y="150" width="12" height="28"/>
  <line class="up wk" x1="305" y1="130" x2="305" y2="180"/><rect class="up" x="299" y="140" width="12" height="28"/>
  <line class="dn wk" x1="340" y1="128" x2="340" y2="170"/><rect class="dn" x="334" y="135" width="12" height="22"/>

  <line class="ent" x1="395" y1="118" x2="430" y2="118"/>
  <text class="t-g" x="438" y="122">③ 触发：穿过旗面上沿</text>
  <line class="up wk" x1="420" y1="70" x2="420" y2="160"/><rect class="up" x="414" y="80" width="12" height="55"/>
  <line class="up wk" x1="460" y1="50" x2="460" y2="100"/><rect class="up" x="454" y="58" width="12" height="32"/>
  <line class="up wk" x1="500" y1="36" x2="500" y2="80"/><rect class="up" x="494" y="44" width="12" height="26"/>

  <line class="stop" x1="175" y1="210" x2="560" y2="210"/>
  <text class="t-r" x="570" y="214">止损：旗面低点下</text>
  <text class="t" x="40" y="340">不要在旗杆中途追。回调若跌破关键支撑，或上方阻力太近，这一笔不做。</text>
</svg>
