<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="整美元半美元是位置不是优势；关口下方横住再突破，止损来自整理低点">
  <title>整美元：心理价位，不是必涨开关</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .dol { stroke: #C08A12; stroke-width: 2; }
    .stop { stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .dol { stroke: #DDA33A; } .stop { stroke: #EF6B5E; }
    }
  </style>
  <line class="dol" x1="40" y1="120" x2="720" y2="120"/>
  <text class="t-a" x="40" y="28">5.00 / 5.50 是常见心理价位。价位本身不是优势。</text>
  <text class="t-a" x="620" y="112">5.00</text>
  <line class="up wk" x1="70" y1="150" x2="70" y2="200"/><rect class="up" x="64" y="160" width="12" height="28"/>
  <line class="dn wk" x1="120" y1="140" x2="120" y2="205"/><rect class="dn" x="114" y="155" width="12" height="35"/>
  <line class="up wk" x1="170" y1="135" x2="170" y2="190"/><rect class="up" x="164" y="148" width="12" height="30"/>
  <line class="dn wk" x1="220" y1="138" x2="220" y2="185"/><rect class="dn" x="214" y="150" width="12" height="24"/>
  <line class="up wk" x1="270" y1="132" x2="270" y2="178"/><rect class="up" x="264" y="145" width="12" height="22"/>
  <line class="up wk" x1="360" y1="60" x2="360" y2="160"/><rect class="up" x="354" y="75" width="12" height="65"/>
  <line class="up wk" x1="420" y1="40" x2="420" y2="100"/><rect class="up" x="414" y="52" width="12" height="38"/>
  <line class="stop" x1="70" y1="205" x2="500" y2="205"/>
  <text class="t-r" x="508" y="209">整理低，不是固定 10 美分</text>
  <text class="t-g" x="40" y="244">需要：关口下方蓄势 + 趋势/量能 + 上方还有空间</text>
  <text class="t" x="40" y="268">高价股在关口假突破一次，固定股数会放大损失。</text>
</svg>
