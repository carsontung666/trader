<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="VWAP突破：先在下方整理，穿过后在上方接受或回踩守住；来回穿越不是方向">
  <title>VWAP 突破：触线不是触发，上方接受才是</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #3D6A94; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .vw { fill: none; stroke: #3D6A94; stroke-width: 2.2; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #7FA9CE; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .vw { stroke: #7FA9CE; }
    }
  </style>
  <polyline class="vw" points="50,160 160,158 280,155 400,150 520,146 680,140"/>
  <text class="t-b" x="40" y="28">VWAP 是量权均价，不是天然支撑。角色随接受方向变。</text>
  <line class="up wk" x1="70" y1="90" x2="70" y2="150"/><rect class="up" x="64" y="100" width="12" height="35"/>
  <line class="dn wk" x1="120" y1="120" x2="120" y2="210"/><rect class="dn" x="114" y="145" width="12" height="50"/>
  <line class="dn wk" x1="170" y1="170" x2="170" y2="240"/><rect class="dn" x="164" y="185" width="12" height="40"/>
  <line class="up wk" x1="220" y1="175" x2="220" y2="235"/><rect class="up" x="214" y="190" width="12" height="30"/>
  <line class="dn wk" x1="270" y1="165" x2="270" y2="220"/><rect class="dn" x="264" y="180" width="12" height="28"/>
  <line class="up wk" x1="320" y1="155" x2="320" y2="210"/><rect class="up" x="314" y="168" width="12" height="30"/>
  <line class="up wk" x1="400" y1="90" x2="400" y2="180"/><rect class="up" x="394" y="105" width="12" height="55"/>
  <line class="dn wk" x1="450" y1="110" x2="450" y2="165"/><rect class="dn" x="444" y="130" width="12" height="22"/>
  <line class="up wk" x1="500" y1="70" x2="500" y2="145"/><rect class="up" x="494" y="85" width="12" height="45"/>
  <line class="up wk" x1="550" y1="50" x2="550" y2="110"/><rect class="up" x="544" y="62" width="12" height="38"/>
  <text class="t-g" x="380" y="210">触发：上破后在上方成交</text>
  <text class="t-g" x="380" y="232">或回踩 VWAP 守住</text>
  <text class="t-r" x="40" y="280">失效：重新跌回 VWAP 并破最近更高低点</text>
  <text class="t" x="40" y="304">第一次穿越经常反复。来回穿 = 没有方向，不是连续加仓理由。</text>
</svg>
