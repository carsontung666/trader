<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="盘前高、开盘区间高、当日最高是三条线，不能混叫一个高点">
  <title>盘前高、ORB 高、HOD 不是同一条线</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.3; }
    .pm { fill: #F4F1E8; }
    .pmh { stroke: #8A94A0; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .orb { stroke: #C08A12; stroke-width: 1.8; }
    .hod { stroke: #15803D; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-a { fill: #E0A93A; } .t-g { fill: #35C07B; } .t-r { fill: #EF6B5E; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .pm { fill: #2A2820; } .pmh { stroke: #6E7884; } .orb { stroke: #DDA33A; } .hod { stroke: #35C07B; }
    }
  </style>
  <rect class="pm" x="28" y="56" width="150" height="190"/>
  <text class="t" x="36" y="48">盘前</text>
  <text class="t-g" x="200" y="48">09:30 之后 · 先走完区间，才有 ORB 高</text>
  <line class="up wk" x1="60" y1="150" x2="60" y2="210"/><rect class="up" x="54" y="165" width="12" height="32"/>
  <line class="up wk" x1="110" y1="120" x2="110" y2="185"/><rect class="up" x="104" y="135" width="12" height="38"/>
  <line class="dn wk" x1="155" y1="135" x2="155" y2="200"/><rect class="dn" x="149" y="150" width="12" height="35"/>
  <line class="pmh" x1="28" y1="120" x2="730" y2="120"/>
  <text class="t" x="620" y="112">盘前高</text>
  <line class="up wk" x1="230" y1="140" x2="230" y2="210"/><rect class="up" x="224" y="160" width="12" height="35"/>
  <line class="dn wk" x1="275" y1="155" x2="275" y2="230"/><rect class="dn" x="269" y="175" width="12" height="40"/>
  <line class="up wk" x1="320" y1="100" x2="320" y2="180"/><rect class="up" x="314" y="118" width="12" height="48"/>
  <line class="orb" x1="200" y1="100" x2="730" y2="100"/>
  <text class="t-a" x="560" y="92">5 分钟 ORB 高</text>
  <line class="up wk" x1="420" y1="70" x2="420" y2="145"/><rect class="up" x="414" y="82" width="12" height="50"/>
  <line class="dn wk" x1="480" y1="90" x2="480" y2="155"/><rect class="dn" x="474" y="108" width="12" height="32"/>
  <line class="up wk" x1="560" y1="42" x2="560" y2="110"/><rect class="up" x="554" y="52" width="12" height="42"/>
  <line class="hod" x1="420" y1="42" x2="730" y2="42"/>
  <text class="t-g" x="640" y="34">后来的 HOD</text>
  <text class="t" x="28" y="274">区间未走完，没有 ORB。刺穿盘前高不是 HOD 突破。HOD 更新后，旧 ORB 高只是阶梯上的一层。</text>
  <text class="t-r" x="28" y="300">日志写来源。三条线同一分钟被打穿，只记事先用来定义失效的那一个主桶。</text>
</svg>
