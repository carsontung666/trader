<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="重要高点被短暂越过后出现放量大红K，价格回到突破位下方；这是转换预警，还要等更低高点和跌破更高低点">
  <title>High-volume false breakout：强预警，不是完整下降趋势</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-r { fill: #C0392B; font-weight: 600; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .lvl { stroke: #C08A12; stroke-width: 1.8; }
    .vol { fill: #C5CCD3; }
    .volr { fill: #DC2626; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; } .t-r { fill: #EF6B5E; } .t-a { fill: #E0A93A; }
      .up { fill: #2FBF71; stroke: #2FBF71; } .dn { fill: #EF5350; stroke: #EF5350; }
      .lvl { stroke: #DDA33A; } .vol { fill: #3A424C; } .volr { fill: #EF5350; }
    }
  </style>
  <text class="t-b" x="36" y="28">重要位置 + 短暂越过 + 放量大红 K + 未能保持 = 转换预警</text>
  <line class="lvl" x1="40" y1="140" x2="620" y2="140"/>
  <text class="t-a" x="628" y="144">阻力 / 前高</text>

  <line class="up wk" x1="80" y1="170" x2="80" y2="230"/><rect class="up" x="72" y="180" width="16" height="40"/>
  <line class="up wk" x1="140" y1="145" x2="140" y2="210"/><rect class="up" x="132" y="155" width="16" height="45"/>
  <line class="dn wk" x1="200" y1="150" x2="200" y2="205"/><rect class="dn" x="192" y="160" width="16" height="35"/>
  <line class="up wk" x1="260" y1="70" x2="260" y2="175"/><rect class="up" x="252" y="85" width="16" height="70"/>
  <text class="t-a" x="232" y="62">短暂越过</text>
  <line class="dn wk" x1="340" y1="90" x2="340" y2="250"/><rect class="dn" x="326" y="120" width="28" height="110"/>
  <text class="t-r" x="372" y="180">放量红 K</text>
  <line class="dn wk" x1="420" y1="190" x2="420" y2="260"/><rect class="dn" x="412" y="205" width="16" height="40"/>
  <line class="up wk" x1="480" y1="170" x2="480" y2="230"/><rect class="up" x="472" y="185" width="16" height="30"/>
  <text class="t" x="460" y="160">更低高点？</text>

  <rect class="vol" x="72" y="290" width="16" height="18"/>
  <rect class="vol" x="132" y="282" width="16" height="26"/>
  <rect class="vol" x="192" y="286" width="16" height="22"/>
  <rect class="vol" x="252" y="270" width="16" height="38"/>
  <rect class="volr" x="326" y="250" width="28" height="58"/>
  <rect class="vol" x="412" y="288" width="16" height="20"/>
  <rect class="vol" x="472" y="292" width="16" height="16"/>

  <text class="t" x="36" y="330">这一根是强预警。完整 downtrend 还要看后续 lower high、更高低点是否失守。</text>
</svg>
