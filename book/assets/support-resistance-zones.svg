<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="支撑和阻力是区域不是细线；价格在两层之间比寻找神奇一条线更有用">
  <title>支撑阻力是区域</title>
  <style>
    .t { fill: #56606C; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-a { fill: #B07D0A; font-weight: 600; }
    .t-g { fill: #15803D; font-weight: 600; }
    .res { fill: #FDE8E8; }
    .sup { fill: #E7F6EC; }
    .up { fill: #16A34A; stroke: #16A34A; }
    .dn { fill: #DC2626; stroke: #DC2626; }
    .wk { stroke-width: 1.4; }
    .now { stroke: #3D6A94; stroke-width: 1.6; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; }
      .t-b { fill: #E8EEF4; }
      .t-a { fill: #E0A93A; }
      .t-g { fill: #35C07B; }
      .res { fill: #3A2424; }
      .sup { fill: #1C3326; }
      .up { fill: #2FBF71; stroke: #2FBF71; }
      .dn { fill: #EF5350; stroke: #EF5350; }
      .now { stroke: #7FA9CE; }
    }
  </style>
  <rect class="res" x="70" y="70" width="520" height="48"/>
  <rect class="sup" x="70" y="268" width="520" height="48"/>
  <text class="t-b" x="80" y="58">阻力区：以前多次卖出成交的一带，不是一根像素线</text>
  <text class="t-g" x="80" y="340">支撑区：以前多次买入成交的一带</text>

  <line class="up wk" x1="110" y1="250" x2="110" y2="290"/><rect class="up" x="104" y="255" width="12" height="28"/>
  <line class="up wk" x1="150" y1="210" x2="150" y2="270"/><rect class="up" x="144" y="218" width="12" height="40"/>
  <line class="dn wk" x1="190" y1="120" x2="190" y2="230"/><rect class="dn" x="184" y="128" width="12" height="70"/>
  <line class="up wk" x1="230" y1="150" x2="230" y2="250"/><rect class="up" x="224" y="160" width="12" height="70"/>
  <line class="up wk" x1="270" y1="100" x2="270" y2="180"/><rect class="up" x="264" y="108" width="12" height="50"/>
  <line class="dn wk" x1="310" y1="95" x2="310" y2="175"/><rect class="dn" x="304" y="108" width="12" height="50"/>
  <line class="dn wk" x1="350" y1="160" x2="350" y2="300"/><rect class="dn" x="344" y="175" width="12" height="90"/>
  <line class="up wk" x1="390" y1="240" x2="390" y2="305"/><rect class="up" x="384" y="250" width="12" height="40"/>
  <line class="up wk" x1="430" y1="180" x2="430" y2="280"/><rect class="up" x="424" y="190" width="12" height="70"/>
  <line class="dn wk" x1="470" y1="130" x2="470" y2="220"/><rect class="dn" x="464" y="140" width="12" height="55"/>
  <line class="up wk" x1="510" y1="145" x2="510" y2="210"/><rect class="up" x="504" y="155" width="12" height="40"/>

  <line class="now" x1="70" y1="200" x2="620" y2="200"/>
  <text class="t-a" x="628" y="204">现在</text>
  <text class="t" x="80" y="370">有用的问题：价格夹在哪两层之间？而不是「哪一条线最神奇」。</text>
</svg>
