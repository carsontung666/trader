<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="市价保执行不保价格；限价保最差价格不保成交；止损触发价不是成交价">
  <title>四种订单各自保证什么</title>
  <style>
    .t { fill: #56606C; font-size: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t-b { fill: #1F2933; font-weight: 600; font-size: 13px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #F7F8FA; stroke: #D0D5DB; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #A3ADB9; } .t-b { fill: #E8EEF4; }
      .box { fill: #1C2228; stroke: #3A424C; }
    }
  </style>
  <rect class="box" x="16" y="20" width="176" height="180" rx="8"/>
  <text class="t-b" x="36" y="48">Market</text>
  <text class="t" x="28" y="76">倾向尽快成交</text>
  <text class="t" x="28" y="100">不保证价格</text>
  <text class="t" x="28" y="124">停牌时可能</text>
  <text class="t" x="28" y="146">完全不成交</text>
  <text class="t" x="28" y="176">薄盘会一路上吃</text>

  <rect class="box" x="200" y="20" width="176" height="180" rx="8"/>
  <text class="t-b" x="220" y="48">Limit</text>
  <text class="t" x="212" y="76">锁住最差价格</text>
  <text class="t" x="212" y="100">不保证成交</text>
  <text class="t" x="212" y="124">也不保证全部</text>
  <text class="t" x="212" y="146">涨太快限价太低</text>
  <text class="t" x="212" y="176">= 整单没成交</text>

  <rect class="box" x="384" y="20" width="176" height="180" rx="8"/>
  <text class="t-b" x="400" y="48">Stop Market</text>
  <text class="t" x="396" y="76">到价才触发</text>
  <text class="t" x="396" y="100">触发后变市价</text>
  <text class="t" x="396" y="124">触发价 ≠ 成交价</text>
  <text class="t" x="396" y="146">跳空/停牌恢复</text>
  <text class="t" x="396" y="176">可远离止损线</text>

  <rect class="box" x="568" y="20" width="176" height="180" rx="8"/>
  <text class="t-b" x="584" y="48">Stop Limit</text>
  <text class="t" x="580" y="76">触发后变限价</text>
  <text class="t" x="580" y="100">锁最差价格</text>
  <text class="t" x="580" y="124">行情越过限价</text>
  <text class="t" x="580" y="146">可能完全出不去</text>
  <text class="t" x="580" y="176">想省滑点的翻车</text>

  <text class="t" x="16" y="224">立刻买打 Ask，立刻卖打 Bid。把三个价格分开记：看到的 / 允许的最差 / 实际成交。</text>
  <text class="t" x="16" y="246">热键只是加速器，配错方向会一起放大。先在模拟盘测空仓、有仓、部分成交、卖超持仓。</text>
</svg>
