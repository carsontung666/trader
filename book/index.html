<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>主动交易手册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="把 Day Trading、Options、Warrior 课程笔记写成的完整手册。不含加密货币。">
  <meta name="theme-color" content="#12181f">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="app">正在加载手册…</div>
  <script>
    function resolvePath(path) {
      var parts = [];
      path.split('/').forEach(function (p) {
        if (!p || p === '.') return;
        if (p === '..') parts.pop();
        else parts.push(p);
      });
      return parts.join('/');
    }

    function splitDest(dest) {
      dest = dest.trim();
      var q = dest.match(/^(.*?)\s+(".*"|'.*')$/);
      if (q) return { href: q[1], title: ' ' + q[2] };
      return { href: dest, title: '' };
    }

    function isAbsUrl(href) {
      return /^(https?:)?\/\//i.test(href) ||
        href.startsWith('/') ||
        href.startsWith('#') ||
        href.startsWith('data:') ||
        href.startsWith('mailto:');
    }

    // Markdown images stay file-relative so Docsify can join them with the
    // current chapter dir. HTML <img> is not joined; rewrite those to the book root.
    function rewriteHtmlImgUrls(content, file) {
      var dir = (file || '').replace(/[^/]*$/, '');
      return content.replace(/<img([^>]*?)src=["']([^"']+)["']/gi, function (m, attrs, src) {
        if (isAbsUrl(src)) return m;
        return '<img' + attrs + 'src="' + resolvePath(dir + src) + '"';
      });
    }

    // Sidebar is compiled in the current chapter's context. Leave its
    // root-relative links alone. Body links like ../appendix/foo.md are
    // rewritten to the book root so they still work with relativePath: false.
    function rewriteMarkdownLinks(content, file) {
      if (/^- \[目录\]\(/.test(content.trim())) return content;
      var dir = (file || '').replace(/[^/]*$/, '');
      return content.replace(/(^|[^!])\[([^\]]*)\]\(([^)]+)\)/g, function (m, prefix, text, dest) {
        var parts = splitDest(dest);
        var href = parts.href;
        if (isAbsUrl(href) || !/\.md($|[?#])/i.test(href)) return m;
        return prefix + '[' + text + '](' + resolvePath(dir + href) + parts.title + ')';
      });
    }

    window.$docsify = {
      name: '主动交易手册',
      nameLink: '#/',
      repo: 'carsontung666/trader',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: false,
      fallbackLanguages: [],
      ext: '.md',
      notFoundPage: false,
      topMargin: 48,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: '搜索手册',
        noData: '没有结果',
        depth: 3,
        hideOtherSidebarContent: true,
        namespace: 'trader-handbook'
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var file = vm.route.file;
            return rewriteMarkdownLinks(rewriteHtmlImgUrls(content, file), file);
          });
          hook.afterEach(function (html) {
            return html + '<p class="site-footer">不是投资建议。规则以附录 A 和官方链接为准，不以课程视频为准。</p>';
          });
        }
      ]
    };
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/zoom-image.min.js"></script>
  <script src="vendor/docsify-pagination.min.js"></script>
</body>
</html>
